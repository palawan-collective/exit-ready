  "index": function () {
const { REGIONS, HANDOFF_TEMPLATE } = window.ER;
const store = window.ER;
const { shorten, esc, fullMoney } = window.ER;

const owned = new Set(store.userListings().map((l) => l.id));
const isLive = (l) => owned.has(l.id) || (l.status || 'live') === 'live';

/* Per-industry covers: consistent, branded, no stock photography. */
const COVERS = {
  'Food & Beverage': { cls: 'cover--fbd', glyph: '<path d="M4 8h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 9h2a2 2 0 0 1 0 4h-2"/>' },
  'Personal Services': { cls: 'cover--svc', glyph: '<path d="M7 4l1.5 5L7 14l1.5 5"/><path d="M17 4l-1.5 5L17 14l-1.5 5"/>' },
  'Trades & Services': { cls: 'cover--trd', glyph: '<path d="M14 4l6 6-3 3-6-6z"/><path d="M11 7L4 14l3 3 7-7"/>' },
  Healthcare: { cls: 'cover--hlt', glyph: '<path d="M12 5v14M5 12h14"/>' },
  Retail: { cls: 'cover--ret', glyph: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>' },
  eCommerce: { cls: 'cover--ecom', glyph: '<path d="M4 8h16v11H4z"/><path d="M9 8V5h6v3"/>' },
  'Professional Services': { cls: 'cover--pro', glyph: '<path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/>' },
  Other: { cls: 'cover--other', glyph: '<path d="M5 6h14M5 12h14M5 18h9"/>' },
};
const cover = (l) => {
  if (l.image) {
    return `<div class="cover cover--photo"><img src="${esc(l.image)}" alt="" loading="lazy"><span class="cover__label">${esc(l.industry)}</span></div>`;
  }
  const c = COVERS[l.industry] || COVERS.Other;
  return `<div class="cover ${c.cls}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">${c.glyph}</svg></div>`;
};

/* ---------- hero stats ---------- */
const heroStats = document.getElementById('hero-stats');
if (heroStats) {
  const facts = [
    { n: REGIONS.length, l: 'live regions' },
    { n: new Set(REGIONS.map((r) => r.symbol)).size, l: 'currencies' },
    { n: HANDOFF_TEMPLATE.length, l: 'sign-off milestones' },
    { n: 0, l: 'surprises at close' },
  ];
  heroStats.innerHTML = facts
    .map((s) => `<div class="hv2-fact"><b>${s.n}</b><small>${esc(s.l)}</small></div>`).join('');
}

/* ---------- hero search ---------- */
const heroForm = document.getElementById('hero-search');
if (heroForm) {
  const extra = document.getElementById('hero-extra');
  const roles = document.querySelectorAll('.hv2-roles button');
  roles.forEach((btn) => btn.addEventListener('click', () => {
    roles.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    const selling = btn.dataset.role === 'sell';
    document.getElementById('hero-q').placeholder = selling
      ? 'Business type or keyword'
      : 'Salon, café, ecommerce…';
    document.getElementById('hero-go').textContent = selling ? 'Get started →' : 'Search →';
    extra.setAttribute('aria-label', selling ? 'Successor type' : 'Price range');
    extra.innerHTML = selling
      ? '<option value="">Any type</option><option value="employee">Employee buyout</option><option value="operator">Local operator</option><option value="first_time">First-time buyer</option>'
      : '<option value="">Any price</option><option value="100000">Under $100k</option><option value="500000">$100k – $500k</option><option value="999999999">$500k+</option>';
  }));

  heroForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = document.getElementById('hero-q').value.trim();
    const region = document.getElementById('hero-region').value;
    const extraValue = extra.value;
    const selling = document.getElementById('hv2-role-sell').getAttribute('aria-pressed') === 'true';
    const params = new URLSearchParams();
    if (q) params.set('q', q);
    if (region) params.set('region', region);
    if (selling && extraValue) params.set('successor', extraValue);
    if (!selling && extraValue) params.set('max', extraValue);
    if (selling) params.set('owner', '1');
    const suffix = params.toString() ? '?' + params.toString() : '';
    location.href = (selling ? 'sell.html' + suffix : 'browse.html' + suffix);
  });
}

/* ---------- listings grid ---------- */
const el = document.getElementById('home-listings');
if (el) {
  el.innerHTML = store.allListings()
    .filter(isLive)
    .slice(0, 6)
    .map((l) => {
      const r = REGIONS.find((x) => x.code === l.region);
      return `
  <a class="card" href="listing.html?id=${encodeURIComponent(l.id)}">

    <div class="card__meta">${esc(r.label)} · ${esc(l.city)}</div>

    <div class="card__tagline">${esc(l.tagline)}</div>

      <div class="figure"><dt>Asking</dt><dd>${shorten(l.asking_price, r.symbol)}</dd></div>
      <div class="figure"><dt>Revenue</dt><dd>${shorten(l.gross_revenue, r.symbol)}</dd></div>
      <div class="figure"><dt>Cash flow</dt><dd>${shorten(l.cash_flow_sde, r.symbol)}</dd></div>
    </dl>
  </a>`;
    }).join('');
}

/* ---------- inventory board ---------- */
const board = document.getElementById('inventory-board');
if (board) {
  const all = store.allListings().filter(isLive);
  document.getElementById('board-total').textContent = all.length;
  document.getElementById('board-regions').textContent = new Set(all.map((l) => l.region)).size;
  document.getElementById('board-milestones').textContent = HANDOFF_TEMPLATE.length;
  const tally = (key) => all.reduce((acc, l) => { acc[l[key]] = (acc[l[key]] || 0) + 1; return acc; }, {});
  const regionLabel = (code) => (REGIONS.find((r) => r.code === code) || {}).label || code;
  const rows = (obj) => Object.entries(obj)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([k, v]) => `<div class="bar"><span class="bar__label">${esc(k)}</span><span class="bar__track"><i class="bar__fill" style="--w:${Math.round(v / all.length * 100)}%"></i></span><span class="bar__num">${v}</span></div>`)
    .join('');
  document.getElementById('board-industry').innerHTML = rows(tally('industry'));
  document.getElementById('board-market').innerHTML = rows(
    Object.fromEntries(Object.entries(tally('region')).map(([k, v]) => [regionLabel(k), v]))
  );
  const obs = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) { e.target.classList.add('is-in'); obs.unobserve(e.target); }
  }, { threshold: 0.15 });
  obs.observe(board);
}

/* ---------- inventory counts (legacy id, no longer rendered) ---------- */
const counts = document.getElementById('counts');
if (counts) {
  const live = store.allListings().filter(isLive);
  const byIndustry = {};
  const byCity = {};
  for (const l of live) {
    byIndustry[l.industry] = (byIndustry[l.industry] || 0) + 1;
    const r = REGIONS.find((x) => x.code === l.region);
    byCity[`${l.city}, ${r.label}`] = (byCity[`${l.city}, ${r.label}`] || 0) + 1;
  }
  const top = (obj, n) => Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n);
  const tile = (n, label) => `<div class="panel"><div class="dash__num">${n}</div><div class="dash__label">${esc(label)}</div></div>`;
  counts.innerHTML = tile(live.length, 'Live listings')
    + top(byIndustry, 4).map(([k, v]) => tile(v, k)).join('')
    + top(byCity, 3).map(([k, v]) => tile(v, k)).join('');
}

/* ---------- recently sold ---------- */
const soldPanel = document.getElementById('sold-panel');
if (soldPanel) {
  const sold = store.soldListings();
  if (sold.length) {
    const sym = (code) => (REGIONS.find((x) => x.code === code) || {}).symbol || '$';
    const comp = store.soldComparables();
    const rows = sold.slice(0, 4).map((l) => {
      const r = REGIONS.find((x) => x.code === l.region);
      return `
      <div class="panel">
        <div class="card__meta">${esc(l.industry)} · ${esc(l.city)}, ${esc(r.label)}</div>

    soldPanel.innerHTML = `<div class="panel"><div class="dash__num">${comp ? comp.count : sold.length}</div>

      <div class="dash__num">0</div>
      <div class="dash__label">No completed sales recorded yet in this browser</div></div>`;
  }
}

/* ---------- scroll reveal ---------- */
store.ready().then(() => {
  const obs = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) { e.target.classList.add('is-in'); obs.unobserve(e.target); }
  }, { rootMargin: '0px 0px -10% 0px' });
  document.querySelectorAll('.reveal').forEach((n) => obs.observe(n));
});

}

/* One-click NDA unlock */
const ndaLock = document.getElementById('nda-lock');
const ndaOpen = document.getElementById('nda-open');
const ndaSign = document.getElementById('nda-sign');
const ndaNote = document.getElementById('nda-note');if (ndaLock && ndaOpen) {
  const applyNda = () => {
    const deal = store.getDeal(l.id);
    if (deal?.nda?.signed) {

    } else {

      const deal = store.getDeal(l.id) || { listingId: l.id };
      deal.nda = { signed: true, signer: buyer?.full_name || 'Verified buyer', at: new Date().toISOString() };
      store.setDeal(l.id, deal);
      applyNda();
    });
  }
  applyNda();
}

  "loi": function () {
const { REGIONS, HANDOFF_TEMPLATE } = window.ER;
const store = window.ER;
const { fullMoney, esc, longDateLabel } = window.ER;

const id = new URLSearchParams((location.hash.split("?")[1] || "")).get('id');
const listing = store.findListing(id);
const root = document.getElementById('root');

if (!listing) {

  store.ready().then(render).catch(render);
}

function render() {
  const r = REGIONS.find((x) => x.code === listing.region);

  const ownerVerification = store.getVerification('owner');
  const buyerVerification = store.getVerification('buyer');
  const nda = deal?.nda || {};

  document.title = `Letter of intent — ${listing.name} — Exit-Ready`;

  const defaults = {

    buyer_email: buyerVerification?.email || '',
    seller_name: listing.owner?.name || ownerVerification?.full_name || '',
    price: listing.asking_price || '',
    deposit: offer.deposit || Math.round((listing.asking_price || 0) * 0.1),
    funding: offer.funding || (listing.financing_ready ? 'Bank loan (pre-qualified)' : ''),
    timeline: offer.timeline || '3–6 months',
    conditions: offer.conditions || 'Subject to financial verification, lease assignment and any required licence transfer.',
  };

  root.innerHTML = `
    <p style="font-family:var(--font-ui); font-size:var(--step--1); margin-bottom:var(--s-4)">
      <a href="browse.html">Browse</a> <span class="muted">/</span>
      <a href="listing.html?id=${encodeURIComponent(listing.id)}">${esc(listing.name)}</a>
      <span class="muted">/</span> <span class="muted">Letter of intent</span>
    </p>

    <div class="sec-head" style="display:flex; justify-content:space-between; align-items:flex-end; gap:var(--s-5); flex-wrap:wrap">
      <div>
        <h2>Letter of intent</h2>
        <p>Generated automatically from the listing, the offer and the handoff plan. Edit the terms and print it.</p>

                <input type="text" id="buyer_name" value="${esc(defaults.buyer_name)}">

      <p style="margin-top:var(--s-5)">This letter is generated by a marketplace tooling provider.

        <div><line id="out-seller-sig">Seller</line></div>
        <div><line id="out-buyer-sig">Buyer</line></div>

  const form = document.getElementById('loi-form');
  const out = {
    date: document.getElementById('out-date'),

    deposit: document.getElementById('out-deposit'),

  const today = new Date();
  out.date.textContent = `${longDateLabel(today.toISOString().slice(0, 10))}`;

  function sync() {
    const v = {
      seller: form.querySelector('#seller_name').value.trim() || '____________________',
      buyer: form.querySelector('#buyer_name').value.trim() || '____________________',
      price: Number(form.querySelector('#price').value) || 0,

    out.sellerSig.textContent = `Seller — ${v.seller}`;
    out.buyerSig.textContent = `Buyer — ${v.buyer}`;
  }

  form.addEventListener('input', sync);
  sync();

  document.getElementById('print-btn').addEventListener('click', () => window.print());
}

function render() {
  const user = store.getUser();
  const isOwnerUser = user?.role === 'owner' && store.isUserListing(listing.id);
  const me = isOwnerUser ? 'owner' : 'buyer';
  const meName = isOwnerUser
    ? (listing.owner?.name || store.getVerification('owner')?.full_name || 'Owner')
    : (store.getVerification('buyer')?.full_name || 'Buyer');

  document.title = `Messages — ${listing.name} — Exit-Ready`;

  if (!user) {
    root.innerHTML = `
      <div class="notice notice--warn">
        <h3>Choose a role to send a message</h3>
        <p>You can read the conversation either way, but you need to be acting as a buyer or an owner to reply.</p>
        <p style="margin:var(--s-3) 0 0"><a class="btn btn--primary" href="dashboard.html">Go to your dashboard</a></p>
      </div>
      ${threadBlock(listing.id, me)}`;
    return;
  }

  root.innerHTML = `
    <p style="font-family:var(--font-ui); font-size:var(--step--1); margin-bottom:var(--s-4)">
      <a href="browse.html">Browse</a> <span class="muted">/</span>
      <a href="listing.html?id=${encodeURIComponent(listing.id)}">${esc(listing.name)}</a>
      <span class="muted">/</span> <span class="muted">Messages</span>
    </p>

    <div class="sec-head" style="display:flex; justify-content:space-between; align-items:flex-end; gap:var(--s-5); flex-wrap:wrap">
      <div>
        <h2>Messages</h2>
        <p>${esc(listing.name)} · you are acting as ${isOwnerUser ? 'the owner' : 'a buyer'}.</p>
      </div>
      <div style="display:flex; gap:var(--s-2); flex-wrap:wrap">
        ${!isOwnerUser ? `<a class="btn btn--ghost" href="offer.html?id=${encodeURIComponent(listing.id)}">Make an offer</a>` : ''}
        <a class="btn btn--ghost" href="deal.html?id=${encodeURIComponent(listing.id)}">Handoff tracker</a>
      </div>
    </div>

    <div class="panel" style="margin-top:var(--s-5)">
      <h2 id="thread-heading">Conversation</h2>
      <ul class="thread" id="thread" aria-labelledby="thread-heading"></ul>
      <form class="composer" id="composer" style="margin-top:var(--s-5)">
        <div class="field">
          <label for="body">Your message</label>
          <textarea id="body" name="body" rows="3"
            placeholder="${isOwnerUser ? 'Answer the buyer...' : 'Ask the owner a question...'}"></textarea>
        </div>
        <div class="hero__actions">
          <button class="btn btn--primary" type="submit">Send</button>
        </div>
      </form>
    </div>
  `;

  const list = document.getElementById('thread');
  const body = document.getElementById('body');

  function paint() {
    const thread = store.threadFor(listing.id);
    if (!thread.length) {
      list.innerHTML = `<li><p class="muted" style="font-family:var(--font-ui); font-size:var(--step--1); margin:0">No messages yet. Ask the first question.</p></li>`;
      return;
    }
    list.innerHTML = thread.map((m) => `
      <li class="msg ${m.from === me ? 'msg--own' : ''}">
        <div class="msg__meta">${esc(m.name)} · ${esc((m.at || '').replace('T', ' ').slice(0, 16))}</div>
        <p>${esc(m.text).replace(/\n/g, '<br>')}</p>
      </li>`).join('');
  }

  document.getElementById('composer').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = body.value.trim();
    if (!text) return;
    store.appendMessage(listing.id, { from: me, name: meName, text });
    body.value = '';
    paint();
  });

  paint();
}

function threadBlock(listingId) {
  const thread = store.threadFor(listingId);
  if (!thread.length) return '';
  return `
    <div class="panel" style="margin-top:var(--s-5)">
      <h2>Conversation</h2>
      <ul class="thread">
        ${thread.map((m) => `
          <li class="msg">
            <div class="msg__meta">${esc(m.name)} · ${esc((m.at || '').replace('T', ' ').slice(0, 16))}</div>
            <p>${esc(m.text).replace(/\n/g, '<br>')}</p>
          </li>`).join('')}
      </ul>
    </div>`;
}

  "offer": function () {
const { REGIONS, HANDOFF_TEMPLATE } = window.ER;
const { readinessScore, readinessBand } = window.ER;
const store = window.ER;
const { fullMoney, esc } = window.ER;

const id = new URLSearchParams((location.hash.split("?")[1] || "")).get('id');
const listing = store.findListing(id);
const root = document.getElementById('root');

if (!listing) {
  root.innerHTML = `
    <div class="notice notice--warn">
      <h3>Listing not found</h3>
      <p>That listing does not exist. <a href="browse.html">Browse all businesses</a>.</p>
    </div>`;
} else {
  render(listing);
}

function render(listing) {
  const r = REGIONS.find((x) => x.code === listing.region);
  const existing = store.getDeal(listing.id);
  const v = store.getVerification('buyer');
  const score = v ? readinessScore(v) : 0;
  const VERIFIED = Boolean(v);
  const band = readinessBand(score);

  document.title = `Make an offer — ${listing.name} — Exit-Ready`;

  root.innerHTML = `
    <p style="font-family:var(--font-ui); font-size:var(--step--1); margin-bottom:var(--s-4)">
      <a href="browse.html">Browse</a> <span class="muted">/</span>
      <a href="listing.html?id=${encodeURIComponent(listing.id)}">${esc(listing.name)}</a>
      <span class="muted">/</span> <span class="muted">Make an offer</span>
    </p>

    <h1 style="font-size: var(--step-4); letter-spacing:-0.025em; margin-bottom: var(--s-3)">Make an offer</h1>
    <p class="muted" style="font-family:var(--font-ui); font-size: var(--step--1); margin-bottom: var(--s-5); max-width: 62ch">
      Two steps: accept the standard NDA, then record your terms. The owner sees the whole
      record — not a message thread.
    </p>

    <div class="detail">
      <div>
        ${!VERIFIED ? `
          <div class="notice notice--warn">
            <h3>Verify before you offer</h3>
            <p>
              Owners only respond to verified buyers. Confirm your identity and declare a funding
              path first — it takes a minute, and it produces the readiness score they see.
            </p>
            <p style="margin:var(--s-3) 0 0"><a class="btn btn--primary" href="verify.html">Get verified</a></p>
          </div>` : `
          <div class="notice notice--info">
            <h3>Your readiness: ${score} / 100 — ${esc(band.label)}</h3>
            <p>The owner can see this score before responding to your offer.</p>
          </div>`}

        ${VERIFIED ? (existing ? existingState(existing, listing, r) : '') : ''}

        ${(!VERIFIED || (existing && existing.offer && ['sent', 'active'].includes(existing.offer.status))) ? '' : `
        <form id="offer-form" class="stack" novalidate>
          <fieldset>
            <legend>Step 1 — Standard non-disclosure agreement</legend>
            <p class="field__hint" style="margin-bottom: var(--s-3)">
              You will keep confidential every non-public detail you receive about this business,
              and you will use it only to evaluate this purchase. This is the gate that unlocks
              financial detail.
            </p>
            <div class="field">
              <label for="nda_name">Printed name (electronic signature)</label>
              <input type="text" id="nda_name" name="nda_name" placeholder="Your full name">
              <span class="field__error" data-for="nda_name" hidden>Enter your printed name.</span>
            </div>
            <label class="check">
              <input type="checkbox" name="nda_agreed">
              <span>I accept the standard NDA and agree to be bound by its terms.</span>
            </label>
            <span class="field__error" data-for="nda_agreed" hidden>You must accept the NDA.</span>
          </fieldset>

          <fieldset>
            <legend>Step 2 — Your offer</legend>
            <div class="form-grid form-grid--2">
              <div class="field">
                <label for="amount">Offer amount (${r.symbol})</label>
                <input type="number" id="amount" name="amount" min="0"
                       value="${listing.asking_price || ''}">
              </div>
              <div class="field">
                <label for="deposit">Deposit (${r.symbol})</label>
                <input type="number" id="deposit" name="deposit" min="0"
                       value="${Math.round((listing.asking_price || 0) * 0.1)}">
              </div>
              <div class="field">
                <label for="funding">Funding path</label>
                <select id="funding" name="funding">
                  <option value="">Select one</option>
                  <option>Cash</option>
                  <option>Bank loan (pre-qualified)</option>
                  <option>Seller financing</option>
                  <option>Investor or partner</option>
                  <option>Combination</option>
                </select>
              </div>
              <div class="field">
                <label for="timeline">Completion timeline</label>
                <select id="timeline" name="timeline">
                  <option value="">Select one</option>
                  <option>1–3 months</option>
                  <option>3–6 months</option>

              </div>
              <div class="field span-2">
                <label for="conditions">Conditions</label>
                <textarea id="conditions" name="conditions"
                  placeholder="e.g. Subject to financial verification, lease assignment and licence transfer."></textarea>
              </div>
              <div class="field span-2">
                <label for="message">Message to the owner <span class="muted">(optional)</span></label>
                <textarea id="message" name="message"
                  placeholder="Who you are, why this business, and how you would run it."></textarea>
              </div>
            </div>
          </fieldset>

          <div class="hero__actions">
            <button class="btn btn--primary" type="submit">Send the offer</button>
            <a class="btn btn--ghost" href="listing.html?id=${encodeURIComponent(listing.id)}">Back to listing</a>
          </div>
          <div id="offer-status" class="notice notice--info" hidden role="status" aria-live="polite"></div>
        </form>`}
      </div>

      <aside class="detail__aside">
        <div class="panel">
          <h2>The business</h2>
          <table class="deftable">
            <tbody>
              <tr><th scope="row">Asking</th><td>${fullMoney(listing.asking_price, r.symbol)}</td></tr>
              <tr><th scope="row">Cash flow (SDE)</th><td>${fullMoney(listing.cash_flow_sde, r.symbol)}</td></tr>
              <tr><th scope="row">Revenue</th><td>${fullMoney(listing.gross_revenue, r.symbol)}</td></tr>
              <tr><th scope="row">Established</th><td>${listing.established || '—'}</td></tr>
            </tbody>
          </table>
        </div>

        <div class="panel">
          <h2>What happens next</h2>
          <ol class="track">
            ${HANDOFF_TEMPLATE.slice(0, 4).map((m) => `<li data-state="pending"><span class="track__label">${esc(m.label)}</span><span class="track__state">pending</span></li>`).join('')}
          </ol>
          <p class="muted" style="font-family:var(--font-ui); font-size:0.75rem; margin-top:var(--s-3)">
            Twelve milestones in total, tracked in the handoff plan.
          </p>
          <p style="margin:0"><a class="btn btn--ghost btn--block" href="handoff.html">See the handoff plan</a></p>
        </div>
      </aside>
    </div>
  `;

  const form = document.getElementById('offer-form');
  const withdraw = document.getElementById('withdraw');
  if (withdraw) {
    withdraw.addEventListener('click', () => {
      const deal = store.getDeal(listing.id) || { listingId: listing.id };
      deal.offer = { ...(deal.offer || {}), status: 'withdrawn', at: new Date().toISOString() };
      store.setDeal(listing.id, deal);
      render(listing);
    });
  }
  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const errors = {};
      const ndaName = form.querySelector('[name="nda_name"]').value.trim();
      const ndaAgreed = form.querySelector('[name="nda_agreed"]').checked;
      const amount = Number(form.querySelector('[name="amount"]').value);
      const deposit = Number(form.querySelector('[name="deposit"]').value);
      const funding = form.querySelector('[name="funding"]').value;
      const timeline = form.querySelector('[name="timeline"]').value;

      if (!ndaName) errors.nda_name = 'Enter your printed name.';
      if (!ndaAgreed) errors.nda_agreed = 'You must accept the NDA.';
      if (!amount) errors.amount = 'Enter an offer amount.';
      if (deposit && deposit > amount) errors.deposit = 'Deposit cannot exceed the offer.';

      form.querySelectorAll('.field__error').forEach((el) => { el.hidden = true; });
      if (Object.keys(errors).length) {
        for (const [name, msg] of Object.entries(errors)) {
          const el = form.querySelector(`.field__error[data-for="${name}"]`);
          if (el) { el.textContent = msg; el.hidden = false; }
        }
        const first = form.querySelector('.field__error:not([hidden])');
        if (first) first.focus?.();
        return;
      }

      const deal = store.getDeal(listing.id) || { listingId: listing.id };
      deal.nda = { signed: true, signer: ndaName, at: new Date().toISOString() };
      deal.offer = {
        amount, deposit: deposit || 0, funding, timeline,
        conditions: form.querySelector('[name="conditions"]').value.trim(),
        message: form.querySelector('[name="message"]').value.trim(),
        status: 'sent',
        at: new Date().toISOString(),
      };
      store.setDeal(listing.id, deal);

      const status = document.getElementById('offer-status');
      status.hidden = false;
      status.className = 'notice notice--info';
      status.innerHTML = `
        <h3>Offer sent</h3>
        <p>${fullMoney(amount, r.symbol)} offered, ${fullMoney(deposit || 0, r.symbol)} deposit,
        ${esc(funding || 'funding not specified')}, ${esc(timeline || 'timeline not specified')}.</p>
        <p style="margin-top:var(--s-3); display:flex; gap:var(--s-2); flex-wrap:wrap">
          <a class="btn btn--primary" href="deal.html?id=${encodeURIComponent(listing.id)}">Open the handoff tracker</a>
          <a class="btn btn--ghost" href="dashboard.html">Go to your dashboard</a>
          <a class="btn btn--ghost" href="loi.html?id=${encodeURIComponent(listing.id)}">Generate the letter of intent</a>
        </p>`;
      status.scrollIntoView({ block: 'center', behavior: 'smooth' });
      form.hidden = true;
    });
  }
}

function existingState(deal, listing, r) {
  const o = deal.offer;
  if (!o) return '';
  const STATES = {
    sent: { tone: 'warn', label: 'Offer sent — awaiting the seller' },
    active: { tone: 'good', label: 'Accepted — deal in progress' },
    declined: { tone: 'low', label: 'Declined' },
    withdrawn: { tone: 'low', label: 'Withdrawn by you' },
  };
  const st = STATES[o.status] || STATES.sent;
  const canWithdraw = o.status === 'sent' && !store.isOwnerOf(listing.id);
  return `
    <div class="notice notice--info">
      <h3>There is already an offer on this listing</h3>
      <table class="deftable" style="margin-top:var(--s-3)">
        <tbody>
          <tr><th scope="row">Status</th><td><span class="tag tag--${st.tone}">${st.label}</span></td></tr>
          <tr><th scope="row">Amount</th><td>${fullMoney(o.amount, r.symbol)}</td></tr>
          <tr><th scope="row">Deposit</th><td>${fullMoney(o.deposit || 0, r.symbol)}</td></tr>
          <tr><th scope="row">Funding</th><td>${esc(o.funding || '—')}</td></tr>
          <tr><th scope="row">Timeline</th><td>${esc(o.timeline || '—')}</td></tr>
          <tr><th scope="row">NDA</th><td>${deal.nda?.signed ? 'Signed by ' + esc(deal.nda.signer) + ', ' + esc((deal.nda.at || '').slice(0, 10)) : 'Not signed'}</td></tr>
        </tbody>
      </table>
      ${o.status === 'active' ? `
        <p style="margin-top:var(--s-3); display:flex; gap:var(--s-2); flex-wrap:wrap">
          <a class="btn btn--primary" href="deal.html?id=${encodeURIComponent(listing.id)}">Open the handoff tracker</a>
          <a class="btn btn--ghost" href="loi.html?id=${encodeURIComponent(listing.id)}">Generate the letter of intent</a>
        </p>` : ''}
      ${canWithdraw ? `
        <p style="margin-top:var(--s-3)">
          <button class="btn btn--ghost" id="withdraw" type="button">Withdraw this offer</button>
        </p>` : ''}
    </div>`;
}

  "sell": function () {
const { HANDOFF_TEMPLATE, REGIONS } = window.ER;
const { listingFromForm, exitPack } = window.ER;
const store = window.ER;
const { fullMoney, esc } = window.ER;

const form = document.getElementById('listing-form');
const status = document.getElementById('form-status');
const preview = document.getElementById('preview');
const curLabel = document.getElementById('cur-label');
const rangeOut = document.getElementById('range-out');
const rangeText = document.getElementById('range-text');

/* Handoff preview */
document.getElementById('handoff-preview').innerHTML = HANDOFF_TEMPLATE.map((m, i) => `
  <li data-state="pending"><span class="track__label">${esc(m.label)}</span>
  <span class="track__state">${i === 0 ? 'starts here' : 'pending'}</span></li>
`).join('');

/* Currency label follows country */
const country = document.getElementById('country');
function syncCurrency() {
  const r = REGIONS.find(x => x.code === country.value);
  curLabel.textContent = `(${r.currency})`;
}
country.addEventListener('change', syncCurrency);
syncCurrency();

/* Live preview */
function updatePreview() {
  const name = form.business_name.value.trim();
  if (!name) {
    preview.textContent = 'Start filling the form and your listing card appears here.';
    return;
  }
  const r = REGIONS.find(x => x.code === form.country.value);
  const price = form.asking_price.value ? fullMoney(form.asking_price.value, r.symbol) : '—';
  const rev = form.gross_revenue.value ? fullMoney(form.gross_revenue.value, r.symbol) : '—';
  const cf = form.cash_flow.value ? fullMoney(form.cash_flow.value, r.symbol) : '—';
  const flags = [...form.querySelectorAll('input[name="flag"]:checked')].length;

  preview.innerHTML = `
    <div class="card" style="border:1px solid var(--rule); border-radius:var(--radius); padding:var(--s-4); background:var(--surface-raised)">
      <div class="card__meta">${esc(r.label)}${form.city.value ? ' · ' + esc(form.city.value) : ''}${form.industry.value ? ' · ' + esc(form.industry.value) : ''}</div>
      <div class="card__name" style="font-size:var(--step-1)">${esc(name)}</div>
      <dl class="card__figures" style="margin-top:var(--s-3)">
        <div class="figure"><dt>Asking</dt><dd>${price}</dd></div>
        <div class="figure"><dt>Revenue</dt><dd>${rev}</dd></div>
        <div class="figure"><dt>Cash flow</dt><dd>${cf}</dd></div>
      </dl>
      <p class="muted" style="font-size:0.75rem; margin:var(--s-3) 0 0">
        ${flags} disclosure flag${flags === 1 ? '' : 's'} declared
      </p>
    </div>`;
}

/* Indicative range from SDE multiple */
const MULTIPLES = { "Food & Beverage": [1.5, 2.5], "Personal Services": [1.2, 2.0],
  "Trades & Services": [1.5, 2.5], "Healthcare": [2.0, 3.5], "Retail": [1.2, 2.2],
  "eCommerce": [2.0, 3.5], "Professional Services": [2.0, 3.5], "Other": [1.5, 2.5] };

function updateRange() {
  const cf = Number(form.cash_flow.value);
  const ind = form.industry.value;
  if (!cf || !ind) { rangeOut.hidden = true; return; }
  const [lo, hi] = MULTIPLES[ind] || MULTIPLES.Other;
  const r = REGIONS.find(x => x.code === form.country.value);
  rangeText.textContent =
    `${fullMoney(Math.round(cf * lo), r.symbol)} to ${fullMoney(Math.round(cf * hi), r.symbol)}`
    + `, based on ${lo}x to ${hi}x annual cash flow for ${ind.toLowerCase()}.`;
  rangeOut.hidden = false;
}

form.addEventListener('input', () => { updatePreview(); updateRange(); });
form.addEventListener('change', () => { updatePreview(); updateRange(); });
form.addEventListener('reset', () => setTimeout(() => { updatePreview(); updateRange(); }, 0));

/* Validation + packaging */
function readValues() {
  const v = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') {
      if (el.name === 'flag' || el.name === 'successor') {
        v[el.name] = [...form.querySelectorAll(`input[name="${el.name}"]:checked`)].map((i) => i.value);
      } else {
        v[el.name] = el.checked;
      }
    } else if (el.type === 'radio') {
      if (el.checked) v[el.name] = el.value;
    } else {
      v[el.name] = el.value;
    }
  }
  return v;
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  let ok = true;

  for (const el of form.querySelectorAll('[required]')) {
    const err = form.querySelector(`.field__error[data-for="${el.id}"]`);
    const bad = !el.value.trim();
    if (err) err.hidden = !bad;
    el.setAttribute('aria-invalid', bad ? 'true' : 'false');
    if (bad) ok = false;
  }

  const succErr = form.querySelector('.field__error[data-for="successor"]');
  const succCount = form.querySelectorAll('input[name="successor"]:checked').length;
  if (succErr) succErr.hidden = succCount > 0;
  if (succCount === 0) ok = false;

  if (!ok) {
    status.hidden = false;
    status.className = 'notice notice--warn';
    status.innerHTML = '<h3>Not ready to publish</h3><p>Check the fields marked above.</p>';
    form.querySelector('[aria-invalid="true"]')?.focus();
    return;
  }

  const v = readValues();
  const owner = store.getVerification('owner');
  const listing = listingFromForm(v);
  if (owner?.full_name && !listing.owner.name) listing.owner.name = owner.full_name;
  if (owner?.email && !listing.owner.email) listing.owner.email = owner.email;
  listing.status = owner?.attested ? 'live' : 'draft';
  store.addListing(listing);

  const pack = exitPack(listing);
  const r = REGIONS.find((x) => x.code === listing.region);
  const flags = listing.disclosure_flags.length;

  status.hidden = false;
  status.className = 'notice notice--info';
  status.innerHTML = `
    <h3>${listing.status === 'live' ? 'Listing published' : 'Listing saved as a draft'}</h3>
    <p>
      <strong>${esc(listing.name)}</strong> is
      ${listing.status === 'live'
        ? 'live and visible to buyers'
        : 'saved as a draft until you verify your identity'},
      with ${flags} disclosure flags declared, including the mandatory unaudited-financials flag.
    </p>
    <div class="prose" style="margin-top:var(--s-3)">
      ${pack.summary.map((p) => `<p style="margin-bottom:var(--s-2)">${esc(p)}</p>`).join('')}
    </div>
    ${pack.range ? `
      <p style="margin-top:var(--s-3)"><strong>Indicative range:</strong>
        ${fullMoney(pack.range.low, r.symbol)} to ${fullMoney(pack.range.high, r.symbol)}
        <span class="muted">(${pack.range.lowMultiple}x–${pack.range.highMultiple}x annual cash flow)</span>
      </p>` : ''}
    <p style="margin-top:var(--s-4); display:flex; gap:var(--s-2); flex-wrap:wrap">
      <a class="btn btn--primary" href="dashboard.html">Go to your dashboard</a>
      <a class="btn btn--ghost" href="listing.html?id=${encodeURIComponent(listing.id)}">View the listing</a>
      ${listing.status !== 'live' ? '<a class="btn btn--ghost" href="verify.html">Verify to publish</a>' : ''}
    </p>
    <p class="muted" style="font-size:0.75rem; margin-top:var(--s-3)">
      Stored in this browser only. The exit pack is generated automatically — orientation, not a valuation.
    </p>`;
  status.scrollIntoView({ block: 'center', behavior: 'smooth' });
});

updatePreview();
  },
  "verify": function () {
const { ID_TYPES, FUNDING_PATHS, TIMELINES, depositBands, budgetBands, INDUSTRIES, READINESS_WEIGHTS, MAX_SCORE, readinessBreakdown, readinessScore, readinessBand, validateBuyer, validateOwner, buyerFromForm, ownerFromForm } = window.ER;
const store = window.ER;
const { esc } = window.ER;

const buyerForm = document.getElementById('buyer-form');
const ownerForm = document.getElementById('owner-form');
const roleBuyer = document.getElementById('role-buyer');
const roleOwner = document.getElementById('role-owner');
const buyerStatus = document.getElementById('buyer-status');
const ownerStatus = document.getElementById('owner-status');

/* ---------- populate selects ---------- */
function fill(select, options, keepFirst = true) {
  const first = keepFirst ? select.options[0] : null;
  select.innerHTML = '';
  if (first) select.appendChild(first);
  for (const o of options) {
    const el = document.createElement('option');
    el.value = o;
    el.textContent = o;
    select.appendChild(el);
  }
}

fill(document.getElementById('b-id_type'), ID_TYPES);
fill(document.getElementById('o-id_type'), ID_TYPES);
fill(document.getElementById('b-funding_path'), FUNDING_PATHS);
fill(document.getElementById('b-timeline'), TIMELINES);
fill(document.getElementById('b-industry'), INDUSTRIES);

function syncRegion() {
  const country = document.getElementById('b-country').value;
  const deposit = document.getElementById('b-deposit_band').value;
  fill(document.getElementById('b-deposit_band'), depositBands(country));
  if (depositBands(country).includes(deposit)) document.getElementById('b-deposit_band').value = deposit;
  const budget = document.getElementById('b-budget').value;
  fill(document.getElementById('b-budget'), budgetBands(country));
  if (budgetBands(country).includes(budget)) document.getElementById('b-budget').value = budget;
}
document.getElementById('b-country').addEventListener('change', syncRegion);
syncRegion();

/* ---------- role toggle ---------- */
function showRole(role) {
  const isBuyer = role === 'buyer';
  buyerForm.hidden = !isBuyer;
  ownerForm.hidden = isBuyer;
  roleBuyer.setAttribute('aria-selected', String(isBuyer));
  roleOwner.setAttribute('aria-selected', String(!isBuyer));
  roleBuyer.className = isBuyer ? 'btn btn--primary' : 'btn btn--ghost';
  roleOwner.className = isBuyer ? 'btn btn--ghost' : 'btn btn--primary';
}
roleBuyer.addEventListener('click', () => showRole('buyer'));
roleOwner.addEventListener('click', () => showRole('owner'));

/* ---------- validation helpers ---------- */
function showErrors(form, errors) {
  form.querySelectorAll('.field__error').forEach(el => { el.hidden = true; });
  form.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
  for (const [name, message] of Object.entries(errors)) {
    const err = form.querySelector(`.field__error[data-for="${name}"]`);
    if (err) { err.textContent = message; err.hidden = false; }
    const field = form.elements[name];
    if (field) field.setAttribute('aria-invalid', 'true');
  }
}

function readForm(form) {
  const v = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') v[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) v[el.name] = el.value; }
    else v[el.name] = el.value;
  }
  return v;
}

/* ---------- buyer submit ---------- */
buyerForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const v = readForm(buyerForm);
  const { ok, errors } = validateBuyer(v);
  if (!ok) {
    showErrors(buyerForm, errors);
    buyerStatus.hidden = false;
    buyerStatus.className = 'notice notice--warn';
    buyerStatus.innerHTML = '<h3>Not ready yet</h3><p>Check the fields marked above.</p>';
    return;
  }
  showErrors(buyerForm, {});
  const buyer = buyerFromForm(v);
  const score = readinessScore(buyer);
  const band = readinessBand(score);
  const rows = readinessBreakdown(buyer).map(row => `
    <tr><th scope="row">${esc(row.label)}</th>
    <td>${row.earned} of ${row.points}</td></tr>`).join('');

  buyerStatus.hidden = false;
  buyerStatus.className = 'notice notice--info';
  buyerStatus.innerHTML = `
    <h3>Your readiness score: ${score} / ${MAX_SCORE} — ${esc(band.label)}</h3>
    <table class="deftable"><tbody>${rows}</tbody></table>
    <p class="muted" style="font-size: 0.75rem; margin-top: var(--s-3)">
      Stored in this browser only. A seller sees the number and the breakdown before releasing
      any financial detail. It is not a guarantee of completion.
    </p>`;
  buyerStatus.scrollIntoView({ block: 'center', behavior: 'smooth' });

  const record = { ...buyer, score, band: band.label, at: new Date().toISOString() };
  store.setVerification('buyer', record);
  if (store.getUser()?.role !== 'buyer') {
    store.setUser({ role: 'buyer', name: buyer.full_name || 'Buyer', email: buyer.email || '' });
  }
  localStorage.setItem('exit-ready:verification:buyer', JSON.stringify(record));
});

/* ---------- owner submit ---------- */
ownerForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const v = readForm(ownerForm);
  const { ok, errors } = validateOwner(v);
  if (!ok) {
    showErrors(ownerForm, errors);
    ownerStatus.hidden = false;
    ownerStatus.className = 'notice notice--warn';
    ownerStatus.innerHTML = '<h3>Not ready yet</h3><p>Check the fields marked above.</p>';
    return;
  }
  showErrors(ownerForm, {});
  const owner = ownerFromForm(v);
  const ref = 'ER-OWN-' + Date.now().toString(36).toUpperCase();
  ownerStatus.hidden = false;
  ownerStatus.className = 'notice notice--info';
  ownerStatus.innerHTML = `
    <h3>Submitted for review</h3>
    <p>Reference <strong>${esc(ref)}</strong>. On the live product a person reviews your
    identity and business records before your listing goes live.</p>
    <p class="muted" style="font-size: 0.75rem">
      Stored in this browser only. Nothing was sent anywhere.
    </p>`;
  ownerStatus.scrollIntoView({ block: 'center', behavior: 'smooth' });

  const record = { ...owner, reference: ref, at: new Date().toISOString() };
  store.setVerification('owner', record);
  if (store.getUser()?.role !== 'owner') {
    store.setUser({ role: 'owner', name: owner.full_name || 'Owner', email: owner.email || '' });
  }
  localStorage.setItem('exit-ready:verification:owner', JSON.stringify(record));
});

/* ---------- restore saved submissions ---------- */
for (const [role, form, status] of [['buyer', buyerForm, buyerStatus], ['owner', ownerForm, ownerStatus]]) {
  const saved = store.getVerification(role);
  if (!saved) continue;
  for (const [name, value] of Object.entries(saved)) {
    const el = form.elements[name];
    if (!el) continue;
    if (el.type === 'checkbox') el.checked = Boolean(value);
    else if (el.type === 'radio') {
      const radio = form.querySelector(`input[name="${name}"][value="${value}"]`);
      if (radio) radio.checked = true;
    } else if (el.type !== 'button') el.value = value ?? '';
  }
  status.hidden = false;
  status.className = 'notice notice--info';
  status.innerHTML = `<h3>Saved submission restored</h3><p>From this browser, stored ${esc(saved.at || '')}.</p>`;
}

let __startRole = 'buyer';
try { __startRole = localStorage.getItem('exit-ready:role') === 'owner' ? 'owner' : 'buyer'; } catch (e) { /* ignore */ }
showRole(__startRole);
  },
};

function route() {
  var raw = location.hash.replace(/^#\/?/, '') || 'index';
  var name = raw.split('?')[0];
  var query = (raw.split('?')[1] || '');
  if (!PAGE_INIT[name]) { name = 'index'; query = ''; }
  location.hash = '#' + name + (query ? '?' + query : '');

  // Put the role switch in every page's masthead.
  var tpl = document.getElementById('t-' + name);
  var node = tpl.content.cloneNode(true);
  var nav = node.querySelector('.masthead__nav');
  if (nav && !nav.querySelector('[data-role-switch]')) {
    var sw = document.createElement('div');
    sw.className = 'role-switch';
    sw.setAttribute('data-role-switch', '');
    sw.setAttribute('role', 'group');
    sw.setAttribute('aria-label', 'Viewing as');
    sw.innerHTML = '<span class="role-switch__label">Viewing as</span>'
      + '<button type="button" data-role="buyer">Buyer</button>'
      + '<button type="button" data-role="owner">Seller</button>';
    nav.appendChild(sw);
  }

  var app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(node);
  document.title = PAGE_TITLES[name] || PAGE_TITLES.index;
  window.scrollTo(0, 0);

  try { PAGE_INIT[name](); } catch (e) {
    var pre = document.createElement('pre');
    pre.style.cssText = 'padding:2rem;font:12px monospace;color:#8C3A2E;white-space:pre-wrap';
    pre.textContent = 'Page "' + name + '" failed: ' + (e && e.stack || e);
    app.appendChild(pre);
    console.error(e);
  }
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
