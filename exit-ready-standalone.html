<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exit-Ready</title>
<style>
/* Hallmark · v2.0.0
 * critique: Utilitarian/trustworthy, sellers-first. A retiring owner is making the
 * largest decision of their working life and is scared of being cheated; the page
 * earns trust by showing the machinery (disclosure flags, handoff milestones,
 * readiness scores) rather than promising outcomes. No invented metrics, no logos.
 * waive: 47b (a document-ruled table treatment is the subject matter here, not a reflex)
 * theme: none (custom utility direction, by request: "just build it")
 */

/* ===========================================================================
   Tokens — every colour and font resolves through here
   =========================================================================== */

:root {
  /* Surfaces */
  --surface:          #FBFAF7;
  --surface-raised:   #FFFFFF;
  --surface-sunken:   #F2F0EA;
  --surface-inverse:  #14171A;

  /* Ink */
  --ink:              #14171A;
  --ink-muted:        #5A6068;
  --ink-faint:        #8A9099;
  --ink-inverse:      #FBFAF7;

  /* Rules */
  --rule:             #DCD8CE;
  --rule-strong:      #B9B4A7;
  --rule-inverse:     #2E3439;

  /* Signal */
  --accent:           #1F5F4B;
  --accent-hover:     #174536;
  --accent-wash:      #E6EFEB;

  --good:             #1F5F4B;
  --good-wash:        #E6EFEB;
  --warn:             #8A5A12;
  --warn-wash:        #F7EEDC;
  --low:              #8C3A2E;
  --low-wash:         #F7E7E3;

  /* Type */
  --font-body:        "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-ui:          ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono:        ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;

  /* Scale */
  --step--1: 0.8125rem;
  --step-0:  1rem;
  --step-1:  1.1875rem;
  --step-2:  1.4375rem;
  --step-3:  1.875rem;
  --step-4:  2.5rem;
  --step-5:  3.375rem;

  /* Space */
  --s-1: 0.25rem;
  --s-2: 0.5rem;
  --s-3: 0.75rem;
  --s-4: 1rem;
  --s-5: 1.5rem;
  --s-6: 2rem;
  --s-7: 3rem;
  --s-8: 4rem;
  --s-9: 6rem;

  --measure: 68ch;
  --container: 1180px;
  --radius: 3px;
  --radius-lg: 5px;
}

/* ===========================================================================
   Base
   =========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html, body { overflow-x: clip; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
  font-kerning: normal;
}

h1, h2, h3, h4 {
  font-family: var(--font-body);
  font-weight: 600;
  line-height: 1.15;
  margin: 0;
  overflow-wrap: break-word;
  min-width: 0;
  color: var(--ink);
}

p { margin: 0 0 var(--s-4); max-width: var(--measure); }

a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { color: var(--accent-hover); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}

img { max-width: 100%; display: block; }

/* ===========================================================================
   Layout
   =========================================================================== */

.container {
  max-width: var(--container);
  margin-inline: auto;
  padding-inline: var(--s-5);
}

@media (min-width: 1400px) {
  .container { padding-inline: var(--s-7); }
}

.section { padding-block: var(--s-8); border-top: 1px solid var(--rule); }
.section--tight { padding-block: var(--s-7); }
.section--plain { border-top: 0; }

.stack > * + * { margin-top: var(--s-5); }

/* ===========================================================================
   Masthead
   =========================================================================== */

.masthead {
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 40;
}

.masthead__inner {
  display: flex;
  align-items: center;
  gap: var(--s-6);
  min-height: 62px;
  flex-wrap: wrap;
}

.wordmark {
  font-family: var(--font-body);
  font-size: var(--step-1);
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--ink);
  text-decoration: none;
  white-space: nowrap;
}
.wordmark:hover { color: var(--ink); }
.wordmark span { color: var(--accent); }

.masthead__nav {
  display: flex;
  gap: var(--s-5);
  margin-inline-start: auto;
  align-items: center;
  flex-wrap: wrap;
}

.masthead__nav a:not(.btn) {
  color: var(--ink-muted);
  font-family: var(--font-ui);
  font-size: var(--step--1);
  text-decoration: none;
  white-space: nowrap;
}
.masthead__nav a:hover { color: var(--ink); }
.masthead__nav a[aria-current="page"] { color: var(--ink); font-weight: 600; }

/* ===========================================================================
   Buttons
   =========================================================================== */

.btn {
  font-family: var(--font-ui);
  font-size: var(--step--1);
  font-weight: 600;
  line-height: 1;
  padding: 0.72em 1.15em;
  border-radius: var(--radius);
  border: 1px solid transparent;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
}

.btn--primary { background: var(--accent); color: var(--ink-inverse); border-color: var(--accent); }
.btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--ink-inverse); }
.btn--primary:active { background: var(--accent-hover); }
.btn--primary:disabled { background: var(--rule-strong); border-color: var(--rule-strong); color: var(--surface); cursor: not-allowed; }

.btn--ghost { background: transparent; color: var(--ink); border-color: var(--rule-strong); }
.btn--ghost:hover { border-color: var(--ink); color: var(--ink); background: var(--surface-raised); }
.btn--ghost:disabled { color: var(--ink-faint); border-color: var(--rule); cursor: not-allowed; }

.btn--quiet { background: transparent; color: var(--accent); border-color: transparent; padding-inline: 0; }
.btn--quiet:hover { color: var(--accent-hover); text-decoration: underline; }

.btn--block { width: 100%; }

/* ===========================================================================
   Hero
   =========================================================================== */

.hero { padding-block: var(--s-8) var(--s-7); }

.hero__grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--s-7);
  align-items: start;
}

@media (min-width: 940px) {
  .hero__grid { grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: var(--s-8); }
}

.hero h1 {
  font-size: var(--step-5);
  letter-spacing: -0.028em;
  margin-bottom: var(--s-4);
}

@media (max-width: 720px) {
  .hero h1 { font-size: var(--step-4); }
}

.hero__lede {
  font-size: var(--step-1);
  color: var(--ink-muted);
  margin-bottom: var(--s-5);
  max-width: 46ch;
}

.hero__actions { display: flex; gap: var(--s-3); flex-wrap: wrap; align-items: center; }

/* Evidence card in hero */
.evidence {
  background: var(--surface-raised);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.evidence__head {
  padding: var(--s-4) var(--s-5);
  border-bottom: 1px solid var(--rule);
  background: var(--surface-sunken);
}

.evidence__head h2 {
  font-family: var(--font-ui);
  font-size: var(--step--1);
  font-weight: 600;
  color: var(--ink-muted);
  margin: 0;
}

.evidence__body { padding: var(--s-5); }

.evidence__row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--s-4);
  padding-block: var(--s-3);
  border-bottom: 1px solid var(--rule);
  font-family: var(--font-ui);
  font-size: var(--step--1);
}
.evidence__row:last-child { border-bottom: 0; }
.evidence__row dt { color: var(--ink-muted); margin: 0; }
.evidence__row dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

/* Milestone track */
.track { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; list-style: none; }

.track li {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  gap: var(--s-3);
  align-items: center;
  padding-block: var(--s-2);
  font-family: var(--font-ui);
  font-size: var(--step--1);
  position: relative;
}

.track li::before {
  content: "";
  width: 9px; height: 9px;
  border-radius: 50%;
  border: 1.5px solid var(--rule-strong);
  background: var(--surface-raised);
  justify-self: center;
}

.track li[data-state="done"]::before { background: var(--good); border-color: var(--good); }
.track li[data-state="in_progress"]::before { background: var(--warn); border-color: var(--warn); }
.track li[data-state="blocked"]::before { background: var(--low); border-color: var(--low); }

.track li[data-state="done"] .track__label { color: var(--ink-muted); }
.track li[data-state="pending"] .track__label { color: var(--ink-faint); }

.track__state {
  font-size: 0.75rem;
  color: var(--ink-faint);
  text-transform: none;
}

/* ===========================================================================
   Filters
   =========================================================================== */

.filters {
  display: flex;
  gap: var(--s-4);
  flex-wrap: wrap;
  align-items: flex-end;
  padding-block: var(--s-5);
}

.field { display: flex; flex-direction: column; gap: var(--s-2); min-width: 0; }
.field label {
  font-family: var(--font-ui);
  font-size: var(--step--1);
  color: var(--ink-muted);
  font-weight: 500;
}

select, input[type="text"], input[type="number"], input[type="search"], textarea {
  font-family: var(--font-ui);
  font-size: var(--step--1);
  padding: 0.62em 0.7em;
  border: 1px solid var(--rule-strong);
  border-radius: var(--radius);
  background: var(--surface-raised);
  color: var(--ink);
  min-width: 0;
  transition: border-color 140ms ease;
}
select:hover, input:hover, textarea:hover { border-color: var(--ink-muted); }
select:disabled, input:disabled, textarea:disabled { background: var(--surface-sunken); color: var(--ink-faint); cursor: not-allowed; }
select[aria-invalid="true"], input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--low); }

textarea { resize: vertical; min-height: 7rem; width: 100%; }

.field__hint { font-family: var(--font-ui); font-size: 0.75rem; color: var(--ink-faint); }
.field__error { font-family: var(--font-ui); font-size: 0.75rem; color: var(--low); font-weight: 600; }

/* ===========================================================================
   Listing grid
   =========================================================================== */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(0, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

@media (min-width: 760px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1080px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.card {
  background: var(--surface-raised);
  padding: var(--s-5);
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  text-decoration: none;
  color: inherit;
  min-width: 0;
}
.card:hover { background: var(--surface-sunken); }
.card:hover .card__name { text-decoration: underline; }

.card__meta {
  font-family: var(--font-ui);
  font-size: var(--step--1);
  color: var(--ink-muted);
}

.card__name {
  font-size: var(--step-2);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.015em;
  overflow-wrap: break-word;
  min-width: 0;
}

.card__tagline {
  font-family: var(--font-ui);
  font-size: var(--step--1);
  color: var(--ink-muted);
  line-height: 1.5;
}

.card__figures {
  display: flex;
  gap: var(--s-5);
  padding-top: var(--s-3);
  border-top: 1px solid var(--rule);
  margin-top: auto;
  flex-wrap: wrap;
}

.figure { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.figure dt { font-family: var(--font-ui); font-size: 0.75rem; color: var(--ink-faint); }
.figure dd {
  font-family: var(--font-ui);
  font-size: var(--step-0);
  font-weight: 600;
  margin: 0;
  font-variant-numeric: tabular-nums;
}

/* ===========================================================================
   Tags
   =========================================================================== */

.tags { display: flex; gap: var(--s-2); flex-wrap: wrap; }

.tag {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  padding: 0.2em 0.55em;
  border: 1px solid var(--rule-strong);
  border-radius: var(--radius);
  color: var(--ink-muted);
  background: var(--surface);
  white-space: nowrap;
}
.tag--good { border-color: var(--good); color: var(--good); background: var(--good-wash); }
.tag--warn { border-color: var(--warn); color: var(--warn); background: var(--warn-wash); }
.tag--low  { border-color: var(--low);  color: var(--low);  background: var(--low-wash); }

/* ===========================================================================
   Disclosure / notice blocks
   =========================================================================== */

.notice {
  border: 1px solid var(--rule-strong);
  border-left-width: 3px;
  border-radius: var(--radius);
  padding: var(--s-4) var(--s-5);
  background: var(--surface-raised);
  font-family: var(--font-ui);
  font-size: var(--step--1);
  line-height: 1.6;
}
.notice--warn { border-left-color: var(--warn); background: var(--warn-wash); }
.notice--info { border-left-color: var(--accent); background: var(--accent-wash); }
.notice h3 { font-family: var(--font-ui); font-size: var(--step--1); font-weight: 600; margin-bottom: var(--s-2); }
.notice p { margin-bottom: var(--s-2); max-width: none; }
.notice p:last-child { margin-bottom: 0; }
.notice ul { margin: var(--s-2) 0 0; padding-left: 1.1em; }
.notice li { margin-bottom: var(--s-1); }

/* ===========================================================================
   Definition table (listing detail)
   =========================================================================== */

.deftable { width: 100%; border-collapse: collapse; font-family: var(--font-ui); font-size: var(--step--1); }
.deftable th, .deftable td {
  text-align: left;
  padding: var(--s-3) var(--s-4) var(--s-3) 0;
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
}
.deftable th { color: var(--ink-muted); font-weight: 500; width: 45%; }
.deftable td { font-weight: 600; font-variant-numeric: tabular-nums; }
.deftable tr:last-child th, .deftable tr:last-child td { border-bottom: 0; }

/* ===========================================================================
   Detail layout
   =========================================================================== */

.detail {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--s-7);
  align-items: start;
}

@media (min-width: 1000px) {
  .detail { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--s-8); }
}

.detail__aside { position: sticky; top: 84px; }

@media (max-width: 999px) { .detail__aside { position: static; } }

.panel {
  background: var(--surface-raised);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
  padding: var(--s-5);
}
.panel + .panel { margin-top: var(--s-5); }

.panel h2 {
  font-family: var(--font-ui);
  font-size: var(--step--1);
  font-weight: 600;
  color: var(--ink-muted);
  margin-bottom: var(--s-4);
}

.prose { max-width: var(--measure); }
.prose h2 { font-size: var(--step-2); margin-top: var(--s-6); margin-bottom: var(--s-3); }
.prose h2:first-child { margin-top: 0; }
.prose ul { max-width: var(--measure); padding-left: 1.15em; }
.prose li { margin-bottom: var(--s-2); }

/* ===========================================================================
   Section headings
   =========================================================================== */

.sec-head { margin-bottom: var(--s-6); max-width: 60ch; }
.sec-head h2 {
  font-size: var(--step-3);
  letter-spacing: -0.02em;
  margin-bottom: var(--s-3);
}
.sec-head p { color: var(--ink-muted); font-size: var(--step-1); margin: 0; max-width: 56ch; }

/* ===========================================================================
   Steps (how it works)
   =========================================================================== */

.steps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
  overflow: hidden;
  counter-reset: step;
}

.step { background: var(--surface-raised); padding: var(--s-5); }
.step::before {
  counter-increment: step;
  content: counter(step, decimal-leading-zero);
  font-family: var(--font-mono);
  font-size: var(--step--1);
  color: var(--ink-faint);
  display: block;
  margin-bottom: var(--s-3);
}
.step h3 { font-size: var(--step-1); margin-bottom: var(--s-2); }
.step p { font-size: var(--step--1); font-family: var(--font-ui); color: var(--ink-muted); margin: 0; max-width: none; }

/* ===========================================================================
   Form
   =========================================================================== */

.form-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--s-5);
}

@media (min-width: 720px) {
  .form-grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

.span-2 { grid-column: 1 / -1; }

fieldset {
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
  padding: var(--s-5);
  margin: 0;
  background: var(--surface-raised);
}
fieldset + fieldset { margin-top: var(--s-5); }

legend {
  font-family: var(--font-ui);
  font-size: var(--step--1);
  font-weight: 600;
  color: var(--ink);
  padding-inline: var(--s-2);
}

.check {
  display: flex;
  gap: var(--s-3);
  align-items: flex-start;
  font-family: var(--font-ui);
  font-size: var(--step--1);
  padding-block: var(--s-2);
  cursor: pointer;
}
.check input { margin-top: 3px; flex-shrink: 0; }
.check span { min-width: 0; }
.check--locked { color: var(--ink-muted); cursor: default; }

/* ===========================================================================
   Footer
   =========================================================================== */

.footer {
  border-top: 1px solid var(--rule);
  background: var(--surface-sunken);
  padding-block: var(--s-7);
  margin-top: var(--s-8);
  font-family: var(--font-ui);
  font-size: var(--step--1);
  color: var(--ink-muted);
}

.footer__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--s-6);
  margin-bottom: var(--s-6);
}

.footer h3 {
  font-family: var(--font-ui);
  font-size: var(--step--1);
  font-weight: 600;
  color: var(--ink);
  margin-bottom: var(--s-3);
}

.footer ul { list-style: none; margin: 0; padding: 0; }
.footer li { margin-bottom: var(--s-2); }
.footer a { color: var(--ink-muted); text-decoration: none; }
.footer a:hover { color: var(--ink); text-decoration: underline; }

.footer__legal {
  border-top: 1px solid var(--rule);
  padding-top: var(--s-5);
  font-size: 0.75rem;
  line-height: 1.7;
  max-width: 85ch;
}
.footer__legal p { margin-bottom: var(--s-3); max-width: none; }

/* ===========================================================================
   Utility
   =========================================================================== */

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--ink);
  color: var(--ink-inverse);
  padding: var(--s-3) var(--s-4);
  z-index: 100;
  font-family: var(--font-ui);
  font-size: var(--step--1);
}
.skip-link:focus { left: var(--s-4); top: var(--s-4); color: var(--ink-inverse); }

.visually-hidden {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.muted { color: var(--ink-muted); }
.tnum { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }

.empty {
  padding: var(--s-8) var(--s-5);
  text-align: center;
  font-family: var(--font-ui);
  color: var(--ink-muted);
  background: var(--surface-raised);
  border: 1px solid var(--rule);
  border-radius: var(--radius-lg);
}

/* Reveal — one only, restrained, visible by default without JS */
.reveal { opacity: 1; }
.js .reveal { opacity: 0; transform: translateY(8px); transition: opacity 400ms ease, transform 400ms ease; }
.js .reveal.is-in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .js .reveal { opacity: 1; transform: none; }
}

/* ===========================================================================
   Deal tracker (handoff plan, interactive)
   =========================================================================== */

.deal__progress {
  display: flex;
  align-items: baseline;
  gap: var(--s-4);
  flex-wrap: wrap;
  margin-bottom: var(--s-3);
  font-family: var(--font-ui);
  font-size: var(--step--1);
  color: var(--ink-muted);
}
.deal__progress strong { color: var(--ink); font-variant-numeric: tabular-nums; }

.deal__bar {
  height: 6px;
  background: var(--surface-sunken);
  border: 1px solid var(--rule);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: var(--s-5);
}
.deal__bar span {
  display: block;
  height: 100%;
  background: var(--good);
  transition: width 240ms ease;
}

.deal__row {
  border: 1px solid var(--rule);
  border-left-width: 3px;
  border-radius: var(--radius-lg);
  padding: var(--s-4) var(--s-5);
  background: var(--surface-raised);
}
.deal__row + .deal__row { margin-top: var(--s-3); }
.deal__row[data-state="done"] { border-left-color: var(--good); }
.deal__row[data-state="in_progress"] { border-left-color: var(--warn); }
.deal__row[data-state="blocked"] { border-left-color: var(--low); }
.deal__row[data-state="pending"] { border-left-color: var(--rule); }

.deal__top {
  display: flex;
  gap: var(--s-4);
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
}
.deal__label { font-family: var(--font-ui); font-size: var(--step--1); font-weight: 600; min-width: 0; }
.deal__index {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--ink-faint);
  display: block;
  margin-bottom: 2px;
}

.deal__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--s-4);
  margin-top: var(--s-4);
}
.deal__field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.deal__field > span { font-family: var(--font-ui); font-size: 0.7rem; color: var(--ink-faint); }
.deal__field input {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  padding: 0.4em 0.55em;
}
.deal__field--wide { grid-column: 1 / -1; }

.deal__sign {
  display: flex;
  gap: var(--s-5);
  flex-wrap: wrap;
  align-items: center;
  margin-top: var(--s-4);
  padding-top: var(--s-4);
  border-top: 1px solid var(--rule);
}
.deal__sign label {
  display: flex;
  gap: var(--s-2);
  align-items: center;
  font-family: var(--font-ui);
  font-size: 0.75rem;
  color: var(--ink-muted);
  cursor: pointer;
}
.deal__sign input { flex-shrink: 0; }

.deal__status {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  font-weight: 600;
}
.deal__status--done { color: var(--good); }
.deal__status--blocked { color: var(--low); }
.deal__status--in_progress { color: var(--warn); }
.deal__status--pending { color: var(--ink-faint); }

.deal__hint {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  color: var(--warn);
  margin-top: var(--s-3);
}
.deal__complete {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  color: var(--good);
  font-weight: 600;
  margin-top: var(--s-3);
}

.deal__actions {
  display: flex;
  gap: var(--s-3);
  flex-wrap: wrap;
  align-items: center;
  margin-top: var(--s-5);
}

/* ===========================================================================
   Hero — full-bleed, one message, the search is the page
   =========================================================================== */

.hero--band {
  background: var(--surface-inverse);
  color: var(--ink-inverse);
  padding-block: var(--s-9) var(--s-8);
  position: relative;
  overflow: hidden;
}
.hero--band::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.055) 1px, transparent 0);
  background-size: 22px 22px;
  pointer-events: none;
}
.hero--band .container { position: relative; z-index: 1; }
.hero--band h1 {
  font-size: clamp(2.5rem, 6.5vw, 4.75rem);
  line-height: 1.02;
  letter-spacing: -0.035em;
  margin-bottom: var(--s-5);

  color: var(--ink-inverse);

.hero--band .btn--ghost:hover {
  border-color: var(--ink-inverse);
  background: rgba(255,255,255,0.06);
  color: var(--ink-inverse);
}

/* The search bar is the focal point */
.hero__search {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) auto;
  gap: 1px;
  background: rgba(255,255,255,0.14);

  border-radius: var(--radius-lg);

  max-width: 780px;
  margin-bottom: var(--s-5);

.hero__stats {

              milestones carry a payment, and how long the training and support windows run.

              <li>Training period is typically longest, because the buyer is learning ownership rather than the trade.</li>
              <li>Staged payments are normal. Milestone five and milestone eleven often carry instalments.</li>
              <li>Staff notification is sensitive: the team is the buyer, so sequencing matters.</li>
              <li>Post-sale support usually runs longest here. The seller often stays reachable for months.</li>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sell your business — Exit-Ready</title>
<meta name="description" content="List your business for sale. Declare the disclosure flags, get an indicative range, and set up a tracked handoff plan.">

<script>document.documentElement.classList.add('js');</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="masthead">
  <div class="container masthead__inner">
    <a class="wordmark" href="index.html">Exit<span>·</span>Ready</a>
    <nav class="masthead__nav" aria-label="Primary">
      <a href="browse.html">Browse businesses</a>
      <a href="sell.html" aria-current="page">Sell yours</a>
      <a href="how-it-works.html">How it works</a>
      <a href="handoff.html">Handoff plan</a>
      <a href="pricing.html">Pricing</a>
      <a href="dashboard.html">Dashboard</a>
      <a class="btn btn--primary" href="#listing-form">Start a listing</a>
      <div class="role-switch" data-role-switch role="group" aria-label="Viewing as">
        <span class="role-switch__label">Viewing as</span>

        <button type="button" data-role="owner">Seller</button>
      </div>
    </nav>
  </div>
</header>

<main id="main">
  <section class="section section--plain">
    <div class="container">
      <div class="sec-head">
        <h2>Sell your business</h2>
        <p>
          Ten minutes now saves months later. The more you declare up front,
          the fewer deals collapse at the offer stage.
        </p>
      </div>

      <div class="detail">
        <form id="listing-form" class="stack" novalidate>

          <!-- ============ BASICS ============ -->
          <fieldset>
            <legend>The basics</legend>
            <div class="form-grid form-grid--2">
              <div class="field span-2">
                <label for="business_name">Business name</label>
                <input type="text" id="business_name" name="business_name" required
                       placeholder="e.g. Seaside Café and Bakery">
                <span class="field__error" data-for="business_name" hidden>Enter a business name.</span>
              </div>

              <div class="field">
                <label for="country">Country</label>
                <select id="country" name="country" required>
                  <option value="US">United States</option>
                  <option value="UK">United Kingdom</option>
                  <option value="PH">Philippines</option>
                </select>
              </div>

              <div class="field">
                <label for="industry">Industry</label>
                <select id="industry" name="industry" required>
                  <option value="">Select an industry</option>
                  <option>Food &amp; Beverage</option>
                  <option>Personal Services</option>
                  <option>Trades &amp; Services</option>
                  <option>Healthcare</option>
                  <option>Retail</option>
                  <option>eCommerce</option>
                  <option>Professional Services</option>
                  <option>Other</option>
                </select>
              </div>

              <div class="field">
                <label for="city">City or town</label>
                <input type="text" id="city" name="city" required placeholder="e.g. San Vicente">
              </div>

              <div class="field">
                <label for="established">Year established</label>
                <input type="number" id="established" name="established" min="1900" max="2026"
                       placeholder="e.g. 2017">
              </div>

              <div class="field span-2">
                <label for="reason">Reason for selling</label>
                <select id="reason" name="reason" required>
                  <option value="">Select a reason</option>
                  <option>Owner retiring</option>
                  <option>Health reasons</option>
                  <option>Relocating</option>
                  <option>Pursuing another venture</option>
                  <option>Partnership dissolution</option>
                  <option>Other</option>
                </select>
              </div>
            </div>
          </fieldset>

          <!-- ============ OWNER DETAILS ============ -->
          <fieldset>
            <legend>Your details</legend>
            <p class="field__hint" style="margin-bottom: var(--s-4)">
              Used to verify you and to show buyers who they are dealing with. Your contact
              details are never published in full.
            </p>
            <div class="form-grid form-grid--2">
              <div class="field">
                <label for="owner_name">Your name</label>
                <input type="text" id="owner_name" name="owner_name" placeholder="e.g. Ramon Cruz">
              </div>
              <div class="field">
                <label for="owner_email">Your email</label>
                <input type="text" id="owner_email" name="owner_email" placeholder="you@example.com">
              </div>
            </div>
          </fieldset>

          <!-- ============ FINANCIALS ============ -->
          <fieldset>
            <legend>Financials</legend>
            <p class="field__hint" style="margin-bottom: var(--s-4)">
              Owner-reported and unaudited. Buyers see this only after signing the NDA.
            </p>
            <div class="form-grid form-grid--2">
              <div class="field">
                <label for="asking_price">Asking price <span id="cur-label">(USD)</span></label>
                <input type="number" id="asking_price" name="asking_price" min="0" required placeholder="144000">
              </div>
              <div class="field">
                <label for="gross_revenue">Gross revenue, annual</label>
                <input type="number" id="gross_revenue" name="gross_revenue" min="0" required placeholder="360000">
              </div>
              <div class="field">
                <label for="cash_flow">Cash flow (SDE), annual</label>
                <input type="number" id="cash_flow" name="cash_flow" min="0" required placeholder="108000">
                <span class="field__hint">Seller's discretionary earnings.</span>
              </div>
              <div class="field">
                <label for="ebitda">EBITDA <span class="muted">(optional)</span></label>
                <input type="number" id="ebitda" name="ebitda" min="0" placeholder="Leave blank if not disclosed">
              </div>
              <div class="field">
                <label for="inventory">Inventory value</label>
                <input type="number" id="inventory" name="inventory" min="0" placeholder="5000">
              </div>
              <div class="field">
                <label for="inventory_included">Is inventory included in the asking price?</label>
                <select id="inventory_included" name="inventory_included" required>
                  <option value="">Select one</option>
                  <option value="yes">Yes, included</option>
                  <option value="no">No, charged separately</option>
                  <option value="na">No inventory</option>
                </select>
                <span class="field__hint">A frequent cause of late-stage disputes. Be explicit.</span>
              </div>
            </div>

            <!-- Indicative range -->
            <div id="range-out" class="notice notice--info" style="margin-top: var(--s-5)" hidden>
              <h3>Indicative range</h3>
              <p id="range-text" class="tnum"></p>
              <p class="muted" style="font-size: 0.75rem">
                A multiple applied to your stated cash flow, for orientation only.
                This is not a valuation and not advice. Commission a licensed valuer before
                you commit to a price.
              </p>
            </div>
          </fieldset>

          <!-- ============ OPERATIONS ============ -->
          <fieldset>
            <legend>Operations</legend>
            <div class="form-grid form-grid--3">
              <div class="field">
                <label for="employees">Number of employees</label>
                <input type="number" id="employees" name="employees" min="0" placeholder="7">
              </div>
              <div class="field">
                <label for="employee_type">Employment type</label>
                <select id="employee_type" name="employee_type">
                  <option value="">Select one</option>
                  <option>Full-time</option>
                  <option>Part-time</option>
                  <option>Mixed</option>
                </select>
              </div>
              <div class="field">
                <label for="real_estate">Premises</label>
                <select id="real_estate" name="real_estate">
                  <option value="">Select one</option>
                  <option>Leased</option>
                  <option>Owned</option>
                  <option>Home based</option>
                  <option>None</option>
                </select>
              </div>
              <div class="field">
                <label for="monthly_rent">Monthly rent</label>
                <input type="number" id="monthly_rent" name="monthly_rent" min="0" placeholder="45000">
              </div>
              <div class="field">
                <label for="lease_expiration">Lease expiry</label>
                <input type="text" id="lease_expiration" name="lease_expiration" placeholder="YYYY-MM-DD">
              </div>
              <div class="field">
                <label for="monthly_payroll">Monthly payroll</label>
                <input type="number" id="monthly_payroll" name="monthly_payroll" min="0" placeholder="98000">
              </div>
            </div>
          </fieldset>

          <!-- ============ SUCCESSOR ============ -->
          <fieldset>
            <legend>Who should take over</legend>
            <p class="field__hint" style="margin-bottom: var(--s-3)">
              This shapes the deal structure and the handoff template.
            </p>
            <label class="check"><input type="checkbox" name="successor" value="employee">
              <span><strong>Employee buyout</strong><br>
              <span class="muted">Your team takes it on. Usually staged payments and a longer training period.</span></span></label>
            <label class="check"><input type="checkbox" name="successor" value="local_operator">
              <span><strong>Local operator</strong><br>
              <span class="muted">Someone already in your trade, nearby. Faster diligence.</span></span></label>
            <label class="check"><input type="checkbox" name="successor" value="first_time">
              <span><strong>First-time buyer</strong><br>
              <span class="muted">Leaving employment to buy. Needs financing support and transition time.</span></span></label>
            <label class="check"><input type="checkbox" name="successor" value="any">
              <span><strong>Open to any verified successor</strong><br>
              <span class="muted">Show the listing to every verified buyer.</span></span></label>
            <span class="field__error" data-for="successor" hidden>Choose at least one successor type.</span>
          </fieldset>

          <!-- ============ DISCLOSURE FLAGS ============ -->
          <fieldset>
            <legend>Disclosure flags</legend>
            <p class="field__hint" style="margin-bottom: var(--s-3)">
              Tick everything that applies. These are shown on your public listing with a
              timestamp. Declaring them costs you nothing now and prevents a collapsed deal later.
            </p>

            <label class="check check--locked">
              <input type="checkbox" checked disabled>
              <span><strong>Financials are unaudited</strong><br>
              <span class="muted">Always shown. Figures are owner-reported until verification.</span></span>
            </label>

            <label class="check"><input type="checkbox" name="flag" value="inventory_excluded">
              <span>Inventory is not included in the asking price</span></label>
            <label class="check"><input type="checkbox" name="flag" value="lease_transfer_required">
              <span>Lease transfer requires landlord consent</span></label>
            <label class="check"><input type="checkbox" name="flag" value="owner_is_key_person">
              <span>The business depends on me personally
              <span class="muted">— my relationships, my hands-on skill, or my licence</span></span></label>
            <label class="check"><input type="checkbox" name="flag" value="staff_retention_risk">
              <span>Staff may leave after the sale</span></label>
            <label class="check"><input type="checkbox" name="flag" value="licence_transfer_required">
              <span>A licence or permit must be transferred to the buyer</span></label>
            <label class="check"><input type="checkbox" name="flag" value="equipment_deferred_maintenance">
              <span>Equipment needs deferred maintenance</span></label>
            <label class="check"><input type="checkbox" name="flag" value="pending_litigation">
              <span>There is pending litigation</span></label>
          </fieldset>

          <!-- ============ DEAL STRUCTURE ============ -->
          <fieldset>
            <legend>Deal structure</legend>
            <label class="check"><input type="checkbox" name="seller_financing">
              <span>I will consider seller financing</span></label>
            <label class="check"><input type="checkbox" name="earn_out">
              <span>I will consider an earn-out</span></label>
            <label class="check"><input type="checkbox" name="financing_ready">
              <span>This business is likely eligible for bank financing</span></label>
          </fieldset>

          <!-- ============ DESCRIPTION ============ -->
          <fieldset>
            <legend>Description</legend>
            <div class="field">
              <label for="description">Describe the business</label>
              <textarea id="description" name="description"
                        placeholder="What it does, who its customers are, why it works, what a new owner would inherit."></textarea>
            </div>
            <div class="field" style="margin-top: var(--s-4)">
              <label for="highlights">Highlights, one per line</label>
              <textarea id="highlights" name="highlights"
                        placeholder="Seven staff, four with more than three years' tenure&#10;In-house bakery supplying two wholesale accounts"></textarea>
            </div>
          </fieldset>

          <div class="notice notice--warn">
            <h3>Before you publish</h3>
            <p>
              This prototype does not submit anywhere. On the live product, publishing
              requires identity verification and a declaration that the information is accurate.
              Knowingly false financial statements are a serious matter in every one of our regions.
            </p>
          </div>

          <div class="hero__actions">
            <button class="btn btn--primary" type="submit">Review and publish</button>
            <button class="btn btn--ghost" type="reset">Clear the form</button>
          </div>

          <div id="form-status" class="notice notice--info" hidden role="status" aria-live="polite"></div>
        </form>

        <!-- ============ PREVIEW ASIDE ============ -->
        <aside class="detail__aside">
          <div class="panel">
            <h2>Live preview</h2>
            <div id="preview" class="muted" style="font-family: var(--font-ui); font-size: var(--step--1)">
              Start filling the form and your listing card appears here.
            </div>
          </div>

          <div class="panel">
            <h2>Your handoff plan</h2>
            <p class="muted" style="font-family: var(--font-ui); font-size: var(--step--1)">
              Twelve milestones are created automatically. You agree the dates with your

            </p>
            <ol class="track" id="handoff-preview"></ol>
          </div>
        </aside>
      </div>
    </div>
  </section>

<body>

<header class="masthead">

<main id="main">
  <section class="section section--plain">
    <div class="container">
      <div class="sec-head">
        <h2>Verify</h2>
        <p>
          One process for both sides. Buyers declare a funding path and get a transparent
          readiness score. Sellers confirm identity, that the business exists, and that they
          are entitled to sell it.
        </p>
      </div>

      <div class="detail">
        <div>
          <!-- Role selector -->
          <div class="filters" role="tablist" aria-label="Choose your role">
            <button class="btn btn--primary" id="role-buyer" role="tab" aria-selected="true" type="button">
              I'm buying a business
            </button>
            <button class="btn btn--ghost" id="role-owner" role="tab" aria-selected="false" type="button">
              I'm selling my business
            </button>
          </div>

          <!-- ================= BUYER ================= -->
          <form id="buyer-form" class="stack" novalidate>
            <fieldset>
              <legend>Your identity</legend>
              <div class="form-grid form-grid--2">
                <div class="field span-2">
                  <label for="b-full_name">Full name</label>
                  <input type="text" id="b-full_name" name="full_name" autocomplete="name">

                <div class="field">
                  <label for="b-email">Email</label>
                  <input type="text" id="b-email" name="email" autocomplete="email">
                </div>
                <div class="field">
                  <label for="b-country">Country</label>
                  <select id="b-country" name="country">
                    <option value="">Select a country</option>
                    <option value="US">United States</option>
                    <option value="UK">United Kingdom</option>
                    <option value="PH">Philippines</option>
                  </select>
                </div>
                <div class="field">
                  <label for="b-id_type">Identity document</label>
                  <select id="b-id_type" name="id_type">
                    <option value="">Select a document</option>

                </div>
                <div class="field">
                  <label for="b-id_number">Document number</label>
                  <input type="text" id="b-id_number" name="id_number">
                </div>
              </div>
            </fieldset>

            <fieldset>
              <legend>How you will fund it</legend>
              <p class="field__hint" style="margin-bottom: var(--s-4)">
                The funding path is only counted when the how, the deposit capacity and the
                timeline are all stated.
              </p>
              <div class="form-grid form-grid--2">
                <div class="field">
                  <label for="b-funding_path">Funding path</label>
                  <select id="b-funding_path" name="funding_path">
                    <option value="">Select one</option>
                  </select>
                </div>
                <div class="field">
                  <label for="b-deposit_band">Deposit capacity</label>
                  <select id="b-deposit_band" name="deposit_band">
                    <option value="">Select a band</option>

                <div class="field">

                    <option value="0">None yet</option>
                    <option value="1">1 reference</option>
                    <option value="2">2 references</option>
                    <option value="3">3 or more</option>
                  </select>
                </div>
              </div>
            </fieldset>

            <fieldset>
              <legend>What you're looking for</legend>
              <p class="field__hint" style="margin-bottom: var(--s-4)">
                This is how listings are matched to you. Change it any time.
              </p>
              <div class="form-grid form-grid--2">
                <div class="field">
                  <label for="b-industry">Industry</label>
                  <select id="b-industry" name="industry">
                    <option value="">Select one</option>
                  </select>
                  <span class="field__error" data-for="industry" hidden>Select an industry.</span>
                </div>
                <div class="field">
                  <label for="b-persona">Successor type</label>
                  <select id="b-persona" name="persona">
                    <option value="">Select one</option>
                    <option value="employee">Employee buyout</option>
                    <option value="local_operator">Local operator</option>
                    <option value="first_time">First-time buyer</option>
                  </select>
                  <span class="field__error" data-for="persona" hidden>Select a successor type.</span>
                </div>
                <div class="field span-2">
                  <label for="b-budget">Budget</label>
                  <select id="b-budget" name="budget">

}

/** Compact money for cards: $144k / ₱2.8M */
function shorten(amount, symbol) {
  if (amount === null || amount === undefined || amount === "") return "—";
  const n = Number(amount);
  if (symbol === "₱") {
    if (n >= 1_000_000) return symbol + (n / 1_000_000).toFixed(n % 1_000_000 === 0 ? 0 : 1) + "M";

function num(v, suffix = "") {
  if (v == null || v === "") return "—";

  if (!iso) return "—";

  return `${String(d).padStart(2,"0")} ${months[m - 1]} ${y}`;

}

  ));

  ],
  any: ['Open to any verified successor. Sequence and pace are agreed case by case.'],
};

/** Read one milestone's effective state, falling back to the listing's sample progress. */
function milestoneState(state, listing, milestoneId) {
  const saved = (state && state[milestoneId]) || {};
  return {
    status: saved.status || listing.handoff_progress?.[milestoneId] || 'pending',
    owner: saved.owner || DEFAULT_OWNER[milestoneId] || 'joint',
    due: saved.due || '',
    evidence: saved.evidence || '',
    seller: Boolean(saved.seller),
    buyer: Boolean(saved.buyer),
    completed_at: saved.completed_at || '',
  };
}

function counts(state, listing, template) {
  const all = template.map((m) => milestoneState(state, listing, m.id));
  return {

    done: all.filter((s) => s.status === 'done').length,

const MULTIPLES = {

  Healthcare: [2.0, 3.5],

/** Turn the sell-form values into the canonical listing object. */
function listingFromForm(v) {
  const id = 'er-' + Date.now().toString(36);
  return {
    id,
    sample: false,
    region: v.country || 'US',
    name: (v.business_name || '').trim(),

    cash_flow_sde: v.cash_flow ? Number(v.cash_flow) : 0,
    ebitda: v.ebitda ? Number(v.ebitda) : null,

/** Indicative valuation range from annual SDE and industry multiples. */
function indicativeRange(listing) {
  const [lo, hi] = MULTIPLES[listing.industry] || MULTIPLES.Other;
  const sde = listing.cash_flow_sde;
  if (!sde) return null;
  return { low: Math.round(sde * lo), high: Math.round(sde * hi), lowMultiple: lo, highMultiple: hi };
}

function regionLabel(code) {
  return (REGIONS.find((r) => r.code === code) || {}).label || code;
}

function summarizeListing(listing) {
  const where = [listing.city, listing.area].filter(Boolean).join(', ') || regionLabel(listing.region);
  const money = (n) => (n == null ? 'undisclosed' : Number(n).toLocaleString('en-US'));

  const first = `${listing.name} is a ${listing.industry.toLowerCase()} business`
    + `${listing.established ? ` established in ${listing.established}` : ''}`
    + ` in ${where}.`
    + (listing.employees_count
      ? ` It employs ${listing.employees_count} ${listing.employee_type ? listing.employee_type.toLowerCase() : ''} staff.`
      : ' There are no employees.');

  const second = listing.gross_revenue
    ? `The business reports about ${money(listing.gross_revenue)} in annual revenue and roughly`
      + ` ${money(listing.cash_flow_sde)} in annual cash flow (seller's discretionary earnings).`
    : 'Financial figures have not been provided yet.';

  const third = [
    listing.real_estate_status ? `Premises are ${listing.real_estate_status.toLowerCase()}.` : null,
    listing.inventory_amount
      ? `Inventory of about ${money(listing.inventory_amount)} is ${listing.inventory_included_in_price ? 'included' : 'not included'} in the asking price.`
      : null,
    listing.seller_financing_offered ? 'The owner will consider seller financing.' : null,
    listing.earn_out_offered ? 'An earn-out is also possible.' : null,
  ].filter(Boolean).join(' ');

  return [first, second, third].filter(Boolean);
}

function exitPack(listing) {
  return {
    summary: summarizeListing(listing),
    range: indicativeRange(listing),
    checklist: HANDOFF_TEMPLATE.map((m) => ({ id: m.id, label: m.label, done: false })),
    generatedAt: new Date().toISOString(),
  };
}

/** Score how well a buyer matches a listing. 0–100. */
function matchScore(listing, criteria) {
  if (!criteria) return 0;
  let score = 0;
  let weight = 0;

  if (criteria.region) { weight += 30; if (listing.region === criteria.region) score += 30; }
  if (criteria.industry) { weight += 25; if (listing.industry === criteria.industry) score += 25; }
  if (criteria.maxPrice) {
    weight += 25;
    if (listing.asking_price && listing.asking_price <= criteria.maxPrice) score += 25;
    else if (listing.asking_price) {
      const over = (listing.asking_price - criteria.maxPrice) / criteria.maxPrice;
      if (over <= 0.2) score += 15;
    }
  }
  if (criteria.successorType) {
    weight += 20;
    if (listing.successor_types_wanted.includes(criteria.successorType)
      || listing.successor_types_wanted.includes('any')) score += 20;
  }
  return weight === 0 ? 0 : Math.round((score / weight) * 100);
}

/** Rank listings for a buyer, best first. */
function recommendedForBuyer(listings, criteria, limit = 6) {
  return listings
    .map((l) => ({ listing: l, score: matchScore(l, criteria) }))
    .filter((r) => r.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, limit);
}

/** Rank buyers for a listing, best first. */
function matchedBuyers(listing, buyers) {
  const regionSymbol = (REGIONS.find((r) => r.code === listing.region) || {}).symbol || '$';
  return buyers
    .map((b) => {
      const criteria = {
        region: b.region,
        industry: b.industry || null,
        maxPrice: b.maxPrice ? Number(b.maxPrice) : null,
        successorType: b.persona,
      };
      return { buyer: b, score: matchScore(listing, criteria), regionSymbol };
    })
    .filter((r) => r.score > 0)
    .sort((a, b) => b.score - a.score);
}

/* ---- store.js ---- */
(function () {
/* Exit-Ready — client-side store, with an optional Supabase mirror.
 *
 * The pages call this module synchronously. Reads come from an in-memory state
 * object that `ready()` fills; writes are applied locally and then mirrored to
 * Supabase when a session exists. With no network or no session the prototype
 * behaves exactly as it did before.
 */

const { LISTINGS } = window.ER;

const SAMPLE_LISTINGS = LISTINGS;
const db = window.ER;
const { REMOTE_ENABLED } = window.ER;

const KEY = 'exit-ready:state:v1';

let state = null;
let session = null;
let primed = false;

/* ---------- local persistence (always on) ---------- */

function load() {
  if (state !== null) return state;
  try {
    const raw = localStorage.getItem(KEY);
    state = raw ? JSON.parse(raw) : {};
  } catch {
    state = {};
  }
  return state;
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

function reset() {
  state = {};
  save();
  return state;
}

/* ---------- user / session ---------- */

function getUser() { return load().user || null; }

function setUser(user) {
  load().user = { ...user, at: new Date().toISOString() };
  save();
  return load().user;
}

function clearUser() {
  delete load().user;
  save();
}

function currentSession() { return session; }

function isSignedIn() { return Boolean(session?.userId); }
function isAdmin() { return session?.profile?.role === 'admin'; }
function isOwnerRole() { return session?.profile?.role === 'owner' || isAdmin(); }

/**
 * Fill the in-memory state from Supabase when a session exists.
 *
 * Fast path and timeout are both deliberate: this must never hold up a page
 * render. With no cached session it returns immediately; with one it still
 * gives up after a few seconds rather than hanging forever.
 */
async function ready() {
  if (primed) return session;
  primed = true;
  if (!REMOTE_ENABLED || !db.isRemote() || !hasCachedSession()) return null;
  try {
    const s = await withTimeout(db.currentSession(), 4000);
    if (!s?.user) return null;
    const profile = await withTimeout(db.ensureProfile(s.user.id, { email: s.user.email || '' }), 4000);
    session = { userId: s.user.id, email: s.user.email || '', profile };
    await withTimeout(pullRemote(), 6000);
    setUser({
      role: profile.role === 'admin' ? 'owner' : profile.role,
      name: profile.display_name || s.user.email || '',
      email: s.user.email || '',
      remote: true,
    });
  } catch (e) {
    console.warn('Exit-Ready: remote state unavailable, continuing locally.', e);
    session = null;
  }
  return session;
}

function hasCachedSession() {
  try {
    const raw = localStorage.getItem('sb-khbtdhvoghdlicgidgkc-auth-token');
    return Boolean(raw && raw !== 'null');
  } catch { return false; }
}

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
  ]);
}

async function pullRemote() {
  const s = load();
  const [live, mine, verification, saved, seenAt] = await Promise.all([
    db.listListings({ status: 'live' }),
    db.listListings({ status: '' }),
    Promise.all([db.getVerification(session.userId, 'owner'), db.getVerification(session.userId, 'buyer')]),
    db.getSaved(session.userId),
    db.getAlertsSeen(session.userId),
  ]);

  const mineIds = new Set(mine.map((l) => l.id));
  s.listings = [...mine, ...live.filter((l) => !mineIds.has(l.id))].map(toLocalListing);
  s.verification = { owner: verification[0], buyer: verification[1] };
  s.saved = saved;
  s.alertsSeenAt = seenAt;

  const deals = {};
  for (const l of s.listings) {
    if (l.owner_id === session.userId) {
      // Seller side: every deal on this listing.
      await pullDeals(l.id, null, deals, true);
    } else {
      await pullDeals(l.id, session.userId, deals, false);
    }
  }
  s.deals = deals;
  save();
}

async function pullDeals(listingId, buyerId, into, asSeller) {
  const rows = asSeller
    ? await db.client().then((c) => c.from('exit_ready.deals').select('*').eq('listing_id', listingId))
    : await db.getDeal(listingId, buyerId);
  const list = asSeller ? (rows.data || []) : (rows ? [rows] : []);
  for (const row of list) {
    const thread = await db.getThread(listingId);
    into[listingId] = {
      listingId,
      buyerId: row.buyer_id,
      nda: row.nda || {},
      offer: row.offer || {},
      milestones: row.milestones || {},
      thread: thread.map((m) => ({ from: m.from_role, name: m.sender_name, text: m.body, at: m.created_at })),
    };
  }
}

function toLocalListing(row) {
  return {
    ...row,
    id: String(row.id),
    sample: false,
    owner: { name: row.owner_name || '', email: row.owner_email || '' },
    handoff_progress: undefined,
    createdByMe: false,
  };
}

/** Push a locally written listing to Supabase. Call after addListing. */
async function persistListing(listing) {
  if (!isSignedIn()) return null;
  try {
    return await db.createListing(toRemoteListing(listing, session.userId));
  } catch (e) {
    console.warn('Exit-Ready: listing not saved remotely.', e);
    throw e;
  }
}

function toRemoteListing(l, ownerId) {
  return {
    owner_id: ownerId,
    region: l.region,
    name: l.name,
    tagline: l.tagline || '',
    city: l.city || '',
    area: l.area || '',
    industry: l.industry || 'Other',
    established: l.established || null,
    asking_price: l.asking_price || 0,
    gross_revenue: l.gross_revenue || 0,
    cash_flow_sde: l.cash_flow_sde || 0,
    ebitda: l.ebitda || null,
    inventory_amount: l.inventory_amount || 0,
    inventory_included_in_price: Boolean(l.inventory_included_in_price),
    financing_ready: Boolean(l.financing_ready),
    employees_count: l.employees_count || 0,
    employee_type: l.employee_type || '',
    real_estate_status: l.real_estate_status || '',
    building_sf: l.building_sf || null,
    lease_expiration: l.lease_expiration || null,
    monthly_rent: l.monthly_rent || null,
    nnn: l.nnn || null,
    hours: l.hours || '',
    monthly_payroll: l.monthly_payroll || null,
    reason_for_selling: l.reason_for_selling || '',
    successor_types_wanted: l.successor_types_wanted || [],
    seller_financing_offered: Boolean(l.seller_financing_offered),
    earn_out_offered: Boolean(l.earn_out_offered),
    disclosure_flags: l.disclosure_flags || [],
    description: l.description || '',
    highlights: l.highlights || [],
    owner_name: l.owner?.name || '',

}

/* ---------- listings ---------- */

function userListings() { return load().listings || []; }
function allListings() { return [...userListings(), ...SAMPLE_LISTINGS]; }
function findListing(id) { return allListings().find((l) => l.id === id) || null; }
function isUserListing(id) { return userListings().some((l) => l.id === id); }

/** True when the listing was created in this browser. Used to decide which side you are. */
function isOwnerOf(id) { return isUserListing(id); }

function addListing(listing) {
  const s = load();
  s.listings = [...(s.listings || []), listing];
  save();
  return listing;
}

async function updateListing(id, patch) {
  const s = load();
  s.listings = (s.listings || []).map((l) => (l.id === id ? { ...l, ...patch } : l));
  save();
  if (isSignedIn() && isOwnerRole()) {
    try { await db.updateListing(id, patch); } catch (e) { console.warn('Exit-Ready: update not saved remotely.', e); }
  }
  return findListing(id);
}

async function deleteListing(id) {

  s.listings = (s.listings || []).filter((l) => l.id !== id);
  save();

  }

  const copy = {
    ...source,
    id: 'er-' + Date.now().toString(36),

    createdAt: new Date().toISOString(),

/* ---------- sold state (the comparables engine) ---------- */

/** Close a listing on a sale. Records the realised price and the date. */
async function markSold(id, soldPrice, soldOn = new Date().toISOString()) {
  const listing = findListing(id);
  if (!listing) return null;
  const patch = {
    status: 'sold',
    sold_price: Number(soldPrice) || 0,
    sold_at: soldOn,
  };
  if (isSignedIn() && isOwnerRole()) {
    try { await db.updateListing(id, patch); } catch (e) { console.warn('Exit-Ready: sold state not saved remotely.', e); }
  }
  const s = load();
  s.listings = (s.listings || []).map((l) => (l.id === id ? { ...l, ...patch } : l));
  save();
  return findListing(id);
}

function soldListings() {
  return userListings().filter((l) => l.status === 'sold');
}

/** Median sold price for an industry, from everything sold in this browser. */
function soldComparables(industry) {
  const rows = industry ? soldListings().filter((l) => l.industry === industry) : soldListings();
  if (!rows.length) return null;
  const prices = rows.map((l) => l.sold_price).filter((p) => p > 0).sort((a, b) => a - b);
  if (!prices.length) return null;
  const mid = Math.floor(prices.length / 2);
  return {
    count: prices.length,
    median: prices.length % 2 ? prices[mid] : Math.round((prices[mid - 1] + prices[mid]) / 2),
    low: prices[0],
    high: prices[prices.length - 1],
  };
}

<script>
/* Exit-Ready — mock role switch.
 *
 * There is no sign-in. The site has two operating modes, buyer and seller, and
 * this is the only thing that selects between them. The choice lives in
 * localStorage so it survives navigation.
 */
(function () {
  var KEY = 'exit-ready:role';
  var bar = document.querySelector('[data-role-switch]');
  if (!bar) return;

  function current() {
    try { return localStorage.getItem(KEY) || 'buyer'; } catch (e) { return 'buyer'; }
  }

  function paint() {
    var role = current();
    bar.querySelectorAll('[data-role]').forEach(function (b) {
      var on = b.getAttribute('data-role') === role;
      b.setAttribute('aria-pressed', String(on));
      b.className = on ? 'btn btn--primary' : 'btn btn--ghost';
    });
    bar.querySelectorAll('[data-role-label]').forEach(function (el) {
      el.textContent = role === 'owner' ? 'Seller' : 'Buyer';
    });
    document.documentElement.setAttribute('data-role', role);
  }

  bar.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-role]');
    if (!btn) return;
    try { localStorage.setItem(KEY, btn.getAttribute('data-role')); } catch (err) { /* ignore */ }
    paint();
    if (typeof window.onRoleChange === 'function') window.onRoleChange(btn.getAttribute('data-role'));
  });

  paint();
})();

</script>

const { LISTINGS, REGIONS, SUCCESSOR_TYPES, DISCLOSURE_FLAGS } = window.ER;
const store = window.ER;
const { shorten, esc } = window.ER;

const ALL = store.allListings();
const owned = new Set(store.userListings().map((l) => l.id));
/* Per-industry covers: consistent, branded, no stock photography. */
const COVERS = {
  'Food & Beverage': { cls: 'cover--fbd', glyph: '<path d="M4 8h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 9h2a2 2 0 0 1 0 4h-2"/>' },

  Other: { cls: 'cover--other', glyph: '<path d="M5 6h14M5 12h14M5 18h9"/>' },
};
const cover = (industry) => {
  const cMap = COVERS[industry] || COVERS.Other;
  return `<div class="cover ${cMap.cls}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">${cMap.glyph}</svg></div>`;
};

const visible = (l) => owned.has(l.id) || ['live', 'sold'].includes(l.status || 'live');

const params = new URLSearchParams((location.hash.split("?")[1] || ""));
const filters = document.getElementById('filters');
const fRegion = document.getElementById('f-region');
const fIndustry = document.getElementById('f-industry');
const fSuccessor = document.getElementById('f-successor');
const fMax = document.getElementById('f-max');
const fSort = document.getElementById('f-sort');
const fQ = document.getElementById('f-q');
const grid = document.getElementById('listing-grid');
const count = document.getElementById('result-count');
const noResults = document.getElementById('no-results');

// Populate selects
REGIONS.forEach(r => fRegion.add(new Option(r.label, r.code)));
[...new Set(ALL.map(l => l.industry))].sort()
  .forEach(i => fIndustry.add(new Option(i, i)));
SUCCESSOR_TYPES.filter(s => s.id !== 'any')
  .forEach(s => fSuccessor.add(new Option(s.label, s.id)));

// Apply URL params
if (params.get('region')) fRegion.value = params.get('region');
if (params.get('q')) fQ.value = params.get('q');
if (params.get('industry')) fIndustry.value = params.get('industry');
if (params.get('successor')) fSuccessor.value = params.get('successor');
if (params.get('max')) fMax.value = params.get('max');

function render() {
  const region = fRegion.value;
  const industry = fIndustry.value;
  const successor = fSuccessor.value;
  const max = fMax.value ? Number(fMax.value) : null;
  const sort = fSort.value;
  const q = fQ.value.trim().toLowerCase();

  let rows = ALL.filter(l => {
    if (!visible(l)) return false;
    if (region && l.region !== region) return false;
    if (industry && l.industry !== industry) return false;
    if (successor && !l.successor_types_wanted.includes(successor)
        && !l.successor_types_wanted.includes('any')) return false;
    if (max !== null) {
      // Currencies are not comparable, so the price filter only applies when a
      // single region is selected. With no region chosen, we compare against the
      // region's own band by converting nothing and skipping the filter, and we
      // say so in the result line rather than returning a misleading list.
      if (!region) return true;
      if (l.asking_price > max) return false;
    }
    return true;
  });

  if (q) {
    const hay = (l) => [l.name, l.tagline, l.city, l.area, l.industry, l.description,
      l.reason_for_selling, ...(l.highlights || [])].join(' ').toLowerCase();
    const words = q.split(/\s+/);
    rows = rows.filter(l => {
      const text = hay(l);
      return words.every(w => text.includes(w));
    });
  }

  if (sort === 'price-asc')  rows = rows.slice().sort((a,b) => a.asking_price - b.asking_price);
  if (sort === 'price-desc') rows = rows.slice().sort((a,b) => b.asking_price - a.asking_price);
  if (sort === 'revenue')    rows = rows.slice().sort((a,b) => b.gross_revenue - a.gross_revenue);

  let msg = rows.length + (rows.length === 1 ? ' listing' : ' listings')
    + (region || industry || successor || max ? ' matching your filters' : '');
  if (max !== null && !region) {
    msg += '. Price filtering needs a region, because listings are priced in three currencies';
  }
  count.textContent = msg;

  if (rows.length === 0) {
    grid.innerHTML = '';
    noResults.hidden = false;
    return;

  noResults.hidden = true;

  grid.innerHTML = rows.map(l => {
    const r = REGIONS.find(x => x.code === l.region);
    const flags = l.disclosure_flags
      .filter(id => !DISCLOSURE_FLAGS.find(f => f.id === id)?.always)

        const f = DISCLOSURE_FLAGS.find(x => x.id === id);
        return f ? `<span class="tag">${esc(f.label)}</span>` : '';
      }).join('');

    return `
    <a class="card" href="listing.html?id=${l.id}">
      ${cover(l.industry)}
      <div class="card__meta">${esc(r.label)} · ${esc(l.city)} · ${esc(l.industry)}</div>
      <div class="card__name">${esc(l.name)}</div>
      <div class="card__tagline">${esc(l.tagline)}</div>
      ${flags ? `<div class="tags">${flags}</div>` : ''}
      ${owned.has(l.id) ? `<div class="tags"><span class="tag tag--${(l.status || 'draft') === 'live' ? 'good' : (l.status || 'draft') === 'sold' ? 'good' : 'warn'}">${(l.status || 'draft') === 'live' ? 'Your live listing' : (l.status || 'draft') === 'sold' ? 'Your sold listing' : 'Your draft'}</span></div>` : ''}
      ${l.status === 'sold' ? `<div class="tags"><span class="tag tag--good">Sold</span></div>` : ''}
      <dl class="card__figures">
        <div class="figure"><dt>Asking</dt><dd>${shorten(l.asking_price, r.symbol)}</dd></div>
        <div class="figure"><dt>Revenue</dt><dd>${shorten(l.gross_revenue, r.symbol)}</dd></div>
        <div class="figure"><dt>Cash flow</dt><dd>${shorten(l.cash_flow_sde, r.symbol)}</dd></div>
      </dl>
    </a>`;
  }).join('');
}

filters.addEventListener('input', render);
filters.addEventListener('submit', e => e.preventDefault());
filters.addEventListener('reset', () => setTimeout(render, 0));
document.getElementById('f-reset-2').addEventListener('click', () => {
  filters.reset(); setTimeout(render, 0);
});

store.ready().then(render).catch(render);

  });

  root.querySelectorAll('.deal__row').forEach(bindRow);
  document.getElementById('deal-reset').addEventListener('click', () => {
    const deal = store.getDeal(l.id) || { listingId: l.id };
    deal.milestones = {};
    store.setDeal(l.id, deal);
    state = {};
    render();
  });
}

function bindRow(row) {
  const mId = row.dataset.milestone;
  const m = HANDOFF_TEMPLATE.find(x => x.id === mId);
  const s = () => ms(m);
  const hint = row.querySelector('[data-role="hint"]');
  const statusSelect = row.querySelector('[data-role="status"]');
  const statusLabel = row.querySelector('[data-role="status-label"]');
  const completedEl = row.querySelector('[data-role="completed"]');

  function showHint(text) {
    hint.textContent = text;
    hint.hidden = !text;
  }

  function refreshProgress() {
    const c = dealCounts();
    document.getElementById('deal-done').textContent = c.done;
    document.getElementById('deal-signed').textContent = c.signed;
    document.getElementById('deal-bar').style.width = `${(c.done / c.total) * 100}%`;
  }

  function changeStatus(next) {
    const cur = s();
    if (!canMove(cur.owner)) {
      showHint(`Only ${ROLE_LABEL[cur.owner].toLowerCase()} can move this milestone.`);
      statusSelect.value = cur.status;
      return;
    }
    const result = applyStatus(state, l, mId, next, formatTimestamp(new Date()));
    if (result.error === 'signoff_required') {
      showHint('Both sides must sign off before a milestone can be marked done.');
      statusSelect.value = cur.status;
      return;
    }
    state = result.state;
    showHint('');
    row.dataset.state = next;
    statusLabel.textContent = STATE_LABEL[next];
    statusLabel.className = `deal__status deal__status--${next}`;
    completedEl.textContent = state[mId].completed_at ? `Completed ${state[mId].completed_at}` : '';
    refreshProgress();
  }

  statusSelect.addEventListener('change', () => changeStatus(statusSelect.value));

  row.querySelector('[data-role="owner"]').addEventListener('change', e => {
    state[mId] = { ...s(), owner: e.target.value };
    save();
  });

  row.querySelector('[data-role="due"]').addEventListener('change', e => {
    state[mId] = { ...s(), due: e.target.value };
    save();
  });

  row.querySelector('[data-role="evidence"]').addEventListener('input', e => {
    state[mId] = { ...s(), evidence: e.target.value };
    save();
  });

  row.querySelector('[data-role="seller"]').addEventListener('change', e => {
    state[mId] = { ...s(), seller: e.target.checked };
    save();
    if (e.target.checked && s().status === 'done' && s().buyer) showHint('');
  });

  row.querySelector('[data-role="buyer"]').addEventListener('change', e => {
    state[mId] = { ...s(), buyer: e.target.checked };
    save();
    if (e.target.checked && s().status === 'done' && s().seller) showHint('');
  });

  if (s().status === 'done' && !isComplete(s())) {
    showHint('Marked done, but both sign-offs are not recorded yet.');
  }
}

store.ready().then(render).catch(render);
  },
  "handoff": function () {
const { HANDOFF_TEMPLATE } = window.ER;
const { esc } = window.ER;

const SAMPLE = {
  loi: 'done', nda: 'done', verification: 'done', offer: 'done',
  deposit: 'in_progress', consent: 'pending', licence: 'pending'
};

const STATE_LABEL = { done: 'done', in_progress: 'in progress', blocked: 'blocked', pending: 'pending' };

function track(states) {

      <span class="track__label">${esc(m.label)}</span>
      <span class="track__state">${STATE_LABEL[s]}</span>
    </li>`;
  }).join('');
}

document.getElementById('standard-track').innerHTML = track({});
document.getElementById('example-track').innerHTML = track(SAMPLE);
  },

/* ---------- inventory counts ---------- */

          </tbody>

    }).join('');
    soldPanel.innerHTML = `<div class="panel"><div class="dash__num">${comp ? comp.count : sold.length}</div>
      <div class="dash__label">Completed sales</div>
      <p class="muted" style="font-family:var(--font-ui); font-size:0.75rem; margin-top:var(--s-2)">
        Median ${comp ? fullMoney(comp.median, '') : '—'}
      </p></div>` + rows;
  } else {
    soldPanel.innerHTML = `<div class="panel" style="grid-column: 1 / -1">
      <div class="dash__num">0</div>
      <div class="dash__label">No completed sales recorded yet in this browser</div></div>`;
  }
}

/* ---------- scroll reveal ---------- */
store.ready().then(() => {
  const obs = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) { e.target.classList.add('is-in'); obs.unobserve(e.target); }
  }, { rootMargin: '0px 0px -10% 0px' });
  document.querySelectorAll('.reveal').forEach((n) => obs.observe(n));
});

        return;
      }

      const deal = store.getDeal(listing.id) || { listingId: listing.id };
      deal.nda = { signed: true, signer: ndaName, at: new Date().toISOString() };
      deal.offer = {
        amount, deposit: deposit || 0, funding, timeline,
        conditions: form.querySelector('[name="conditions"]').value.trim(),
        message: form.querySelector('[name="message"]').value.trim(),
        status: 'sent',
        at: new Date().toISOString(),
      };
      store.setDeal(listing.id, deal);

      const status = document.getElementById('offer-status');
      status.hidden = false;
      status.className = 'notice notice--info';
      status.innerHTML = `
        <h3>Offer sent</h3>
        <p>${fullMoney(amount, r.symbol)} offered, ${fullMoney(deposit || 0, r.symbol)} deposit,
        ${esc(funding || 'funding not specified')}, ${esc(timeline || 'timeline not specified')}.</p>
        <p style="margin-top:var(--s-3); display:flex; gap:var(--s-2); flex-wrap:wrap">
          <a class="btn btn--primary" href="deal.html?id=${encodeURIComponent(listing.id)}">Open the handoff tracker</a>
          <a class="btn btn--ghost" href="dashboard.html">Go to your dashboard</a>
          <a class="btn btn--ghost" href="loi.html?id=${encodeURIComponent(listing.id)}">Generate the letter of intent</a>
        </p>`;
      status.scrollIntoView({ block: 'center', behavior: 'smooth' });
      form.hidden = true;
    });
  }
}

function existingState(deal, listing, r) {
  const o = deal.offer;
  if (!o) return '';
  const STATES = {
    sent: { tone: 'warn', label: 'Offer sent — awaiting the seller' },
    active: { tone: 'good', label: 'Accepted — deal in progress' },
    declined: { tone: 'low', label: 'Declined' },
    withdrawn: { tone: 'low', label: 'Withdrawn by you' },
  };
  const st = STATES[o.status] || STATES.sent;
  const canWithdraw = o.status === 'sent' && !store.isOwnerOf(listing.id);
  return `
    <div class="notice notice--info">
      <h3>There is already an offer on this listing</h3>
      <table class="deftable" style="margin-top:var(--s-3)">
        <tbody>
          <tr><th scope="row">Status</th><td><span class="tag tag--${st.tone}">${st.label}</span></td></tr>
          <tr><th scope="row">Amount</th><td>${fullMoney(o.amount, r.symbol)}</td></tr>
          <tr><th scope="row">Deposit</th><td>${fullMoney(o.deposit || 0, r.symbol)}</td></tr>
          <tr><th scope="row">Funding</th><td>${esc(o.funding || '—')}</td></tr>
          <tr><th scope="row">Timeline</th><td>${esc(o.timeline || '—')}</td></tr>
          <tr><th scope="row">NDA</th><td>${deal.nda?.signed ? 'Signed by ' + esc(deal.nda.signer) + ', ' + esc((deal.nda.at || '').slice(0, 10)) : 'Not signed'}</td></tr>
        </tbody>
      </table>
      ${o.status === 'active' ? `
        <p style="margin-top:var(--s-3); display:flex; gap:var(--s-2); flex-wrap:wrap">
          <a class="btn btn--primary" href="deal.html?id=${encodeURIComponent(listing.id)}">Open the handoff tracker</a>
          <a class="btn btn--ghost" href="loi.html?id=${encodeURIComponent(listing.id)}">Generate the letter of intent</a>
        </p>` : ''}
      ${canWithdraw ? `
        <p style="margin-top:var(--s-3)">
          <button class="btn btn--ghost" id="withdraw" type="button">Withdraw this offer</button>
        </p>` : ''}
    </div>`;
}
  },
